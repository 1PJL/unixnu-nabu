            for(unsigned bit: {2U,7U,11U,16U,17U,18U}) {
              Fake f;Report r;f.regs[0x20/4]=1U<<bit;
              assert(run(f,f.memory,f.physical,r)==End::ExistingError);assert(f.writes.empty());++cases;
            }
            std::printf("PASS %u NOP transport cases (simulated MMIO/DMA, not hardware qualification)\n",cases);
          }
          NOP_TESTS
          xcrun clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            UniXNU/tests/nabu-nop-core.cpp -o "$RUNNER_TEMP/nabu-nop-core-test"
          "$RUNNER_TEMP/nabu-nop-core-test"

      - name: Test NOP SMMU preflight with simulated registers
        run: |
          python3 - <<'EXTRACT_NOP_MAPPING'
          from pathlib import Path
          s = Path('UniXNU/scripts/nabu-ufs-register-probe.cpp').read_text()
          a = s.index('struct Mapping {')
          b = s.index('static IOBufferMemoryDescriptor', a)
          Path('UniXNU/scripts/nabu-nop-mapping.h').write_text(s[a:b])
          a = s.index('static bool readMapping(void)')
          b = s.index('struct HardwarePort', a)
          Path('UniXNU/scripts/nabu-nop-mapping-functions.h').write_text(s[a:b])
          EXTRACT_NOP_MAPPING
          cat > UniXNU/tests/nabu-nop-mapping.cpp <<'NOP_MAPPING_TESTS'
          // SPDX-License-Identifier: BSD-2-Clause-Patent
          #include <cstdint>
          #include <cassert>
          #include <cstdio>
          #include <map>
          static constexpr uint64_t smmuBytes=0x100000;
          static constexpr uint32_t expectedSid=0x300;
          #include "../scripts/nabu-nop-mapping.h"
          static std::map<uint64_t,uint32_t> registers;
          static uint32_t sr(uint64_t offset) {assert(offset<=smmuBytes-4 && !(offset&3));return registers[offset];}
          #include "../scripts/nabu-nop-mapping-functions.h"
          static void reset() {
           registers.clear();mapping=Mapping{};
           registers[0x20]=0x08000080;registers[0x24]=0x60000080;registers[0x28]=0x50;
           registers[0]=0x002f0406;registers[0x808]=0x80000300;registers[0xc08]=1;
           registers[0x1004]=0x1f000;registers[0x1804]=1;registers[0x81000]=0x009f00e0;registers[0x81058]=0x400;
          }
          int main() {
           unsigned cases=0;
           reset();assert(readMapping());assert(mapping.bank==1 && mapping.context==0x81000 && mapping.outputBits==48);assert(mappingUnchanged());++cases;
           // Reject each of the route/geometry/fault states independently.
           const std::pair<uint64_t,uint32_t> rejected[]={{0x20,0},{0x24,0xffffffff},{0x808,0},{0xc08,0x10001},{0xc08,2},
             {0x1004,0},{0x1804,0},{0x81000,0x009f00e1},{0,0x002f0407},{0x81058,0x402},{0x48,2},
             {0x28,0xf0},{0x24,0x60000001},{0,0x002f040e}};
           for(auto entry:rejected) {reset();registers[entry.first]=entry.second;assert(!readMapping());++cases;}
           reset();registers[0x80c]=0x80000300;registers[0xc0c]=1;assert(!readMapping());++cases;
           // After a valid observation, every state used for address interpretation is checked again.
           const uint64_t changed[]={0,0x20,0x24,0x28,0x808,0xc08,0x1004,0x1804,0x81000};
           for(uint64_t at:changed){reset();assert(readMapping());registers[at]^=1;assert(!mappingUnchanged());++cases;}
           reset();assert(readMapping());registers[0x81058]=0x402;assert(!mappingUnchanged());++cases;
           reset();assert(readMapping());registers[0x48]=2;assert(!mappingUnchanged());++cases;
           // Extended stream-ID mode must use S2CR.EXIDVALID, rather than SMR.VALID.
           reset();registers[0x20]|=1U<<8;registers[0]|=1U<<3;registers[0x808]=0x300;registers[0xc08]=0x401;
           assert(readMapping());assert(mappingUnchanged());++cases;
           std::printf("PASS %u NOP SMMU guard cases (simulated registers, not hardware qualification)\n",cases);
          }
          NOP_MAPPING_TESTS
          xcrun clang++ -std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined \
            UniXNU/tests/nabu-nop-mapping.cpp -o "$RUNNER_TEMP/nabu-nop-map-test"
          "$RUNNER_TEMP/nabu-nop-map-test"

      - name: Build kernel

        run: |
          cd UniXNU
          # The tree was already assembled (and patched) by the "Assemble tree" step.
          # Re-running `unixnu tree` here applied the patches a second time, failed on
          # the ones that are not idempotent, and the `|| true` hid it -- leaving make to
          # build a half-patched tree. Build the tree that was actually assembled.
          ./unixnu build kernel
          ls -lh out/nabu/kernel/ || true
        timeout-minutes: 180

      - name: Verify generated diagnostic sources
        run: |
          python3 - <<'VERIFY'
          from pathlib import Path
          root = Path('UniXNU/out/nabu/tree/.cache/xnu-work')
          marker = (root / 'osfmk/arm/nabu_early_mark.c').read_text()
          assert '#define NABU_MAX_MARK 98' in marker
          assert 'g_hits[2]' in marker and 'g_last_hit, 20)' in marker
          expected = {
              'bsd/kern/bsd_init.c': ['bsd-autoconf-return', 'clock-init', 'setconf', 'find-root-return', 'mount-root', 'mount-root-failed'],
              'iokit/bsddev/IOKitBSDInit.cpp': ['iokit-bsd-return', 'find-root-entry', 'bsd-resource-wait', 'bsd-resource-wait-return', 'root-service-wait'],
              'osfmk/kern/debug.c': ['panic-entered'],
              'osfmk/arm64/sleh.c': ['abort-entered'],
          }
          for file, labels in expected.items():
              content = (root / file).read_text()
              for label in labels:
                  assert content.count('/* post64:' + label + ' */') == 1, (file, label)
          print('All post64 probes are present in generated sources.')
          VERIFY

      - name: Verify linked NOP-only test
        id: verify_ufs
        run: |
          python3 - <<'VERIFY_UFS'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess

          tree = Path('UniXNU/out/nabu/tree')
          build = tree / 'build/native-ufs'
          arguments = json.loads((build / 'compile-command.json').read_text())
          inputs = [Path(p) for p in arguments if p.endswith('/nabu-ufs-register-probe.cpp')]
          assert len(inputs) == 1, 'NativeUfs was not compiled from the register-only source'
          source = Path('UniXNU/scripts/nabu-ufs-register-probe.cpp')
          assert inputs[0].read_bytes() == source.read_bytes(), 'Compiled source changed during reassembly'
          obj = build / 'NativeUfs.o'
          object_symbols = subprocess.run(['xcrun', 'nm', str(obj)], check=True, capture_output=True, text=True).stdout
          assert 'NativeUfs' in object_symbols
          assert 'nabu_ufs_register_probe_phase' in object_symbols
          for forbidden in ('NativeUfsBlock', 'IOBlockStorageDevice', 'vr_open', 'vr_verify_block'):
              assert forbidden not in object_symbols, 'Unexpected storage implementation in probe: ' + forbidden

          personality = tree / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/KernelConfigTables.cpo'
          recipe = json.loads(personality.with_suffix('.cpo.json').read_text().strip().rstrip(','))
          # Clang's -MJ compile record can normalize -DNAME=value into TWO arguments:
          # ["-D", "NAME=value"]. Accept both spellings; require the same exact value.
          recorded_arguments = recipe['arguments']
          defines = {arg[2:] for arg in recorded_arguments if arg.startswith('-D') and len(arg) > 2}
          defines.update(recorded_arguments[index + 1]
                         for index, arg in enumerate(recorded_arguments[:-1]) if arg == '-D')
          assert 'XNU_NATIVE_UFS=1' in defines, 'Final personality table is missing XNU_NATIVE_UFS=1; recorded defines: ' + repr(sorted(defines))
          print('Final personality table: XNU_NATIVE_UFS=1 (normalized compiler record checked)')
          assert b'NativeUfsRoot' in personality.read_bytes(), 'Root-provider personality is absent'

          log = Path('UniXNU/out/nabu/logs/kernel.log').read_text(errors='replace')
          links = [s for s in log.splitlines() if s.startswith('stub archive wired:')]
          assert len(links) == 1
          assert 'libNativeUfs.a' in links[0], 'Diagnostic service was not passed to final link'
          assert 'IOBlockStorageDevice-reference.o' not in links[0], 'Duplicate base class still linked'
          assert 'libVerifiedRootStub.a' not in links[0], 'Register probe must not link the unused empty policy stub'
          assert 'register-only IOService; do not link IOBlockStorageDevice-reference.o' in log

          kernel = Path('UniXNU/out/nabu/kernel/kernel.macho')
          data = kernel.read_bytes()
          symbols = subprocess.run(['xcrun', 'nm', '-g', '-U', str(kernel)], check=True, capture_output=True, text=True).stdout
          for required in ('NativeUfs', 'nabu_ufs_register_probe_phase', 'nabu_ufs_register_probe_hc_read', 'nabu_ufs_survey_page', 'nabu_ufs_survey_complete'):
              assert required in symbols, 'Missing linked probe symbol: ' + required
          assert 'NativeUfsBlock' not in symbols
          assert b'nabu-ufs-nop-v2\0' in data
          assert b'NOP IN VERIFIED - NO DISK IO' in data
          assert b'NABU UFS NOP V2 - SINGLE COMMAND' in data
          source_text = source.read_text()
          assert source_text.count('p.write(0x58, 1);') == 1
          assert 'p.write(0x34' not in source_text and 'p.write(0x90' not in source_text
          assert 'pinnedDma->complete' not in source_text and 'pinnedDma->release' not in source_text
          assert 'dc civac' in source_text and 'dc ivac' in source_text
          assert 'IODelay(' not in source_text
          assert b'LIVE STEP\0' in data and b'LIVE VALUE\0' in data
          sha = hashlib.sha256(data).hexdigest()
          report = {
              'purpose': 'SM8150/nabu single NOP OUT/IN transport test; no SCSI or disk data IO',
              'kernel_sha256': sha,
              'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'upstream_commit': 'eafa7e11ee63ac6a87b4a16019f51bcc1a980bb2',
              'required_boot_argument': 'nabu-ufs-register-probe=1',
              'required_page_argument': 'nabu-ufs-nop=1 (mandatory explicit opt-in); no survey pages',
              'expected_ufs_sid': '0x300 from SM8150 device tree; not discovered at runtime',
              'smmu_window': '0x15000000 + 0x100000 from stock nabu vendor device tree',
              'ufs_sid_reference': 'https://github.com/torvalds/linux/blob/v6.12/arch/arm64/boot/dts/qcom/sm8150.dtsi',
              'smmu_reference': 'https://github.com/torvalds/linux/blob/v6.12/drivers/iommu/arm/arm-smmu/arm-smmu.h',
              'runtime_qualified': False,
              'live_step_codes': {
                  '0A': 'Before doorbell write', '0B': 'Doorbell store and DSB returned',
                  '0C': 'Before first doorbell read', '0D': 'Doorbell read returned; LIVE VALUE is DB',
                  '0E': 'Interrupt-status read returned; LIVE VALUE is accumulated IS',
                  '0F': 'Before invalidate-only DMA acquire', '10': 'DMA cache acquire returned',
                  '11': 'OCS byte loaded; LIVE VALUE is OCS', '12': 'Before finite CPU pacing',
                  '13': 'CPU pacing returned', '15': 'Transfer poll iteration limit reached',
              },
              'scope_review': {
                  'controller_mmio_stores': 'Idle queue takeover: IE=0, UTRL stop/base/start, completion W1C=1 and one doorbell bit 0; no HCE reset, UIC commands or task-list changes',
                  'scsi_commands': 'None implemented',
                  'dma': 'Dedicated prepared physically-contiguous 16 KiB allocation, raw PA, CTR-sized cache maintenance; retained until reboot, no complete/release/reuse',
                  'queue_or_ttbr_address_dereferences': 'Only own DMA allocation is dereferenced; firmware queue addresses and page tables are never mapped',
                  'smmu_mapping_changes': 'None implemented',
                  'smmu_scan_guard': 'ID0.SMS and bounded NUMSMRG; EXIDS valid-bit mode checked',
                  'context_read_guard': 'One SID 0x300 match, CB1, CBAR.TYPE=1, CBA2R.VA64=1, SCTLR.M=0; no SMMU faults; route rechecked before submission and after response',
                  'block_device_publication': 'None implemented',
                  'host_register_guard': 'Power/clock valid, UFSHCI 2.x/3.0, HCE/HCS ready, transfer/task queues idle, no error, auto-hibernate disabled; otherwise skipped',
              },
              'linked_probe_object_symbol_checks': 'passed',
              'final_link_arguments_exclude_duplicate_storage_base': True,
              'stop': '96 means result display complete; success requires code=0, OCS=0 and NOP IN; LIVE STEP is independent of global BSD marks. 98 means core returned.',
          }
          Path('ufs-nop.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('kernel_sha256=' + sha + '\n')
          print(json.dumps(report, indent=2))
          VERIFY_UFS

      - name: Verify early checkpoint marks
        if: always()
        run: |
          echo "=== injection records in build logs ==="
          for f in UniXNU/out/nabu/logs/kernel.log UniXNU/out/nabu/logs/kernel-bootstrap.log; do
            if [ -f "$f" ]; then
              echo "--- $f"
              grep -a -E 'nabu pre-clean|marks inserted|WARN: mark' "$f" || echo "    (no mark record)"
            fi
          done
          echo "=== nabu symbols in the built mach-o ==="
          found=0
          while IFS= read -r k; do
            found=1
            echo "--- $k"
            ls -lh "$k"
            xcrun llvm-nm --defined-only "$k" 2>/dev/null | grep -i nabu_mark || echo "    (no nabu_mark symbol)"
          done < <(find UniXNU/out/nabu/kernel -name '*.macho' 2>/dev/null | head -5)
          [ "$found" = 1 ] || echo "(no mach-o in UniXNU/out/nabu/kernel)"

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "===== kernel.log (real build) ====="
          tail -250 UniXNU/out/nabu/logs/kernel.log 2>/dev/null || echo "(missing)"
          echo "===== kernel-bootstrap.log (record pass) ====="
          tail -60 UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null || echo "(missing)"
          echo "===== bootstrap errors (full file scan) ====="
          grep -a -nE 'error:|Error [0-9]|\*\*\*|undefined symbol|No such file|cannot find' \
            UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | head -25 || echo "(no error lines)"
          echo "===== bootstrap log size / tail of make output ====="
          wc -l UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null
          grep -a -nE 'make(\[[0-9]\])?:' UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | tail -10
          echo "===== where LDFILELIST is defined ====="
          cd UniXNU/out/nabu/tree/.cache/xnu-work 2>/dev/null && \
            grep -rn 'LDFILELIST' --include=Makefile* --include=*.cmd --include=*.def --include=*.top . 2>/dev/null | head -20
          echo "===== bsd filelist inputs present? ====="
          cd "$GITHUB_WORKSPACE/UniXNU/out/nabu/tree/.cache/xnu-work" 2>/dev/null && {
            ls -la bsd/conf/ 2>/dev/null | head -10
            echo "--- resolved bsd sources ---"
            ls build/obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT/*.o 2>/dev/null | wc -l
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nabu-ufs-nop
          path: |
            UniXNU/out/nabu/kernel/
            UniXNU/out/nabu/logs/
            post64-checkpoints.json
            ufs-nop.json
            UniXNU/scripts/nabu-ufs-register-probe.cpp
            UniXNU/out/nabu/tree/build/native-ufs/compile-command.json
            UniXNU/out/nabu/tree/build/native-ufs/compile.log
            UniXNU/out/nabu/tree/build/native-ufs/NativeUfs.o
            UniXNU/out/nabu/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/KernelConfigTables.cpo.json
            UniXNU/out/nabu/tree/build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/KernelConfigTables.cpo
          if-no-files-found: warn

  prepare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_KERNEL_SHA256: ${{ needs.build.outputs.kernel_sha256 }}
    steps:
      - name: Check out pinned ADT generator
        uses: actions/checkout@v4
        with:
          repository: Lux12138/UniXNU
          ref: 48ea812633d59b796dee3dc0781b9e174075f457
          path: UniXNU-source
          persist-credentials: false

      - name: Download this run's checked register-probe kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-nabu-ufs-nop
          github-token: ${{ github.token }}
          path: kernel-input

      - name: Check kernel and prepare staging directory
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import json
          import shutil
          import struct
          from pathlib import Path

          candidates = list(Path('kernel-input').rglob('kernel.macho'))
          assert len(candidates) == 1, 'Expected exactly one kernel.macho'
          source = candidates[0]
          data = source.read_bytes()
          expected = os.environ['EXPECTED_KERNEL_SHA256']
          assert len(expected) == 64
          assert hashlib.sha256(data).hexdigest() == expected, 'Kernel differs from checked artifact'
          magic, cpu, subtype, filetype, count, command_bytes = struct.unpack_from('<6I', data)
          assert (magic, cpu, subtype, filetype) == (0xfeedfacf, 0x100000c, 0, 2)
          end = 32 + command_bytes
          assert end <= len(data)
          offset = 32
          segments = []
          entry = None
          for _ in range(count):
              assert offset + 8 <= end
              command, length = struct.unpack_from('<II', data, offset)
              assert length >= 8 and length % 8 == 0 and offset + length <= end
              if command == 0x19:
                  assert length >= 72
                  address, size, file_offset, file_size = struct.unpack_from('<4Q', data, offset + 24)
                  sections = struct.unpack_from('<I', data, offset + 64)[0]
                  assert sections <= (length - 72) // 80
                  if size:
                      protection = struct.unpack_from('<I', data, offset + 60)[0]
                      assert size <= 0x10000000 and address + size < 1 << 64
                      assert file_size <= size and file_offset + file_size <= len(data)
                      segments.append((address, size, file_size, protection))
              elif command == 5:
                  assert entry is None and length == 288
                  assert struct.unpack_from('<II', data, offset + 8) == (6, 68)
                  entry = struct.unpack_from('<Q', data, offset + 272)[0]
              offset += length
          assert offset == end and entry is not None and 0 < len(segments) <= 64
          ordered = sorted(segments)
          assert all(a[0] + a[1] <= b[0] for a, b in zip(ordered, ordered[1:])), 'Overlapping segments'
          base = min(s[0] for s in segments)
          limit = max(s[0] + s[1] for s in segments)
          assert base % 4096 == 0 and entry % 4 == 0
          assert limit - base <= 0x10000000 - 0x200000
          assert any(a <= entry < a + f and p & 4 for a, _, f, p in segments)
          target = Path('stage/EFI/UniXNU/Payloads')
          target.mkdir(parents=True)
          shutil.copyfile(source, target / 'kernel.macho')
          Path('payload-output').mkdir()
          mappings = list(Path('kernel-input').rglob('post64-checkpoints.json'))
          assert len(mappings) == 1, 'Expected the post64 checkpoint mapping'
          shutil.copyfile(mappings[0], 'payload-output/post64-checkpoints.json')
          probes = list(Path('kernel-input').rglob('ufs-nop.json'))
          assert len(probes) == 1
          assert json.loads(probes[0].read_text())['kernel_sha256'] == expected
          shutil.copyfile(probes[0], 'payload-output/ufs-nop.json')
          # Verify the new state variable is present in the linked symbol table.
          offset = 32
          found = False
          for _ in range(count):
              command, length = struct.unpack_from('<II', data, offset)
              if command == 2:
                  symoff, nsyms, stroff, strsize = struct.unpack_from('<4I', data, offset + 8)
                  strings = data[stroff:stroff+strsize]
                  index = strings.find(b'_g_last_hit\0')
                  if index >= 0:
                      found = any(i == index and t & 0x0e == 0x0e
                                  for i, t, section, desc, value in struct.iter_unpack(
                                      '<IBBHQ', data[symoff:symoff+nsyms*16]))
              offset += length
          assert found, 'Post64 diagnostic state is missing from the kernel'
          report = {
              'purpose': 'One NOP OUT/IN transaction using own pinned DMA and idle queue takeover; no disk data IO',
              'runtime_qualified': False,
              'abi_qualified': False,
              'kernel_source_run': int(os.environ['GITHUB_RUN_ID']),
              'kernel_sha256': expected,
              'kernel_virtual_span_bytes': limit - base,
              'device_dram_bytes': 0x180000000,
              'requested_contiguous_window_bytes': 0x20000000,
              'window_address': 'Allocated from EfiConventionalMemory by DarwinBoot at runtime',
              'expected_cust_partition_bytes': 0x40000000,
              'observed_userdata_bytes': 0x1AB57BB000,
              'storage_layout_changes': 'None performed by this workflow',
          }
          Path('payload-output/payload-manifest.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Generate 6 GiB diagnostic ADT
        shell: bash
        run: |
          python3 UniXNU-source/scripts/make-nabu-adt.py \
            --dram-size 0x180000000 \
            --owned-memory-size 0x20000000 \
            --cpu-regs '0,0x100,0x200,0x300,0x400,0x500,0x600,0x700' \
            --output stage/EFI/UniXNU/Payloads/kernel.macho.adt

      - name: Create manual boot menu
        shell: bash
        run: |
          cat > stage/EFI/UniXNU/unixnu.toml <<'TOML'
          version = 1
          [boot]
          timeout = -1
          fallback_timeout = 120
          default = "return"
          rotate = 0
          [kits]
          autoload = false
          [ui]
          title = "nabu UFS NOP v2"
          logo = true
          console = "auto"
          [[entry]]
          id = "return"
          title = "Return to firmware"
          type = "action"
          action = "exit"
          [[entry]]
          id = "nop"
          title = "One NOP test - live steps - no disk IO"
          type = "xnu"
          path = "Payloads/kernel.macho"
          args = "serial=3 -enable_kprintf_spam nabu-ufs-register-probe=1 nabu-ufs-nop=1"
          [[entry]]
          id = "restart"
          title = "Restart"
          type = "action"
          action = "reset"
          TOML

      - name: Install FAT image utilities
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends dosfstools mtools

      - name: Build and verify FAT payload image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GITHUB_WORKSPACE/payload-output/nabu-cust-ufs-nop.img"
          truncate -s 64M "$IMAGE"
          mkfs.vfat -F 16 -n NABUXNU "$IMAGE"
          mcopy -i "$IMAGE" -s stage/EFI ::/
          fsck.fat -n "$IMAGE"
          mkdir payload-readback
          mcopy -i "$IMAGE" -s ::/EFI payload-readback/
          diff -r stage/EFI payload-readback/EFI
          mdir -i "$IMAGE" -/ ::/EFI/UniXNU
          python3 - <<'PY'
          import hashlib
          import json
          import struct
          from pathlib import Path

          image = Path('payload-output/nabu-cust-ufs-nop.img')
          assert image.stat().st_size == 64 * 1024 * 1024
          tree = Path('stage/EFI/UniXNU/Payloads/kernel.macho.adt').read_bytes()
          nodes = {}
          def parse(offset=0, parent=''):
              properties, children = struct.unpack_from('<II', tree, offset)
              offset += 8
              values = {}
              for _ in range(properties):
                  key, length = struct.unpack_from('<32sI', tree, offset)
                  offset += 36
                  key = key.split(b'\0', 1)[0].decode()
                  assert offset + length <= len(tree)
                  values[key] = tree[offset:offset+length]
                  offset += (length + 3) & ~3
              name = values['name'].rstrip(b'\0').decode()
              path = parent + '/' + name
              nodes[path] = values
              for _ in range(children):
                  offset = parse(offset, path)
              return offset
          assert parse() == len(tree)
          chosen = nodes['/device-tree/chosen']
          assert struct.unpack('<Q', chosen['dram-size'])[0] == 0x180000000
          assert struct.unpack('<Q', chosen['darwinboot-memory-size'])[0] == 0x20000000
          memory = nodes['/device-tree/chosen/memory-map']
          assert not any(k in memory for k in ('RAMDisk', 'PackedRAMDisk', 'TrustCache'))
          report_path = Path('payload-output/payload-manifest.json')
          report = json.loads(report_path.read_text())
          report['files'] = {
              str(p): {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in [image, *sorted(Path('stage/EFI').rglob('*'))] if p.is_file()
          }
          report_path.write_text(json.dumps(report, indent=2) + '\n')
          print('FAT filesystem, file readback and ADT checks passed.')
          PY

      - name: Upload payload for review
        uses: actions/upload-artifact@v4
        with:
          name: nabu-ufs-nop-payload
          if-no-files-found: error
          compression-level: 6
          path: payload-output/
