name: Build nabu UFS NOP v2

on:
  push:
    paths:
      - .github/workflows/build-ufs-nop.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350
    outputs:
      kernel_sha256: ${{ steps.verify_ufs.outputs.kernel_sha256 }}
    env:
      UNIXNU_DEBUG_LDFILELIST: "1"
      XNU_MAKE_V: "1"
      XNU_NABU_UFS_REGISTER_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16
        run: |
          echo "=== available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo none
          # xnu-10063's MIG stubs must be generated by the oldest toolchain available:
          # newer iig emits IORPC.kernelContent / different reply-size metadata, and
          # mig_init() then trips "kroutine must have precise size" or overflows the
          # dispatch table. That is exactly where the boot was dying.
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | head -1)
          echo "picked: $XC"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $GITHUB_ENV
            echo "exported DEVELOPER_DIR=$XC/Contents/Developer"
          else
            echo "no Xcode 16 found"
          fi
          xcodebuild -version
          xcrun --find clang
      - name: Environment check
        run: |
          xcodebuild -version
          python3 --version
          uname -m
          df -h /

      - name: Clone UniXNU
        run: |
          git init UniXNU
          git -C UniXNU remote add origin https://github.com/Lux12138/UniXNU.git
          git -C UniXNU fetch --depth 1 origin eafa7e11ee63ac6a87b4a16019f51bcc1a980bb2
          git -C UniXNU checkout --detach FETCH_HEAD
          git -C UniXNU submodule update --init --recursive --depth 1
          git -C UniXNU rev-parse HEAD

      - name: Select defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig nabu_defconfig -D "$GITHUB_WORKSPACE"
          # Enable the IOService personality for THIS diagnostic build only.
          printf '\nCONFIG_XNU_NATIVE_UFS=y\n' >> out/nabu/.config

      - name: Fetch sources
        run: cd UniXNU && ./unixnu fetch
        timeout-minutes: 60

      - name: Fetch IPSW
        run: cd UniXNU && ./unixnu ipsw fetch
        timeout-minutes: 60

      - name: Assemble tree
        run: cd UniXNU && ./unixnu tree
        timeout-minutes: 30

      - name: Pre-cache XNU headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd UniXNU/out/nabu/tree
          mkdir -p .cache/sources
          TAG="xnu-10063.121.3"
          TRUST_TAG="xnu-8796.101.5"
          SHORT=${TAG#xnu-}
          TSHORT=${TRUST_TAG#xnu-}
          echo "TAG=$TAG TRUST_TAG=$TRUST_TAG"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit/crypto?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-crypto-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/EXTERNAL_HEADERS/TrustCache?ref=$TRUST_TAG" \
            -o ".cache/sources/xnu-trustcache-$TSHORT.json"
          echo "=== cached json ==="
          ls -la .cache/sources/
      - name: Fetch IOStorageFamily (public Apple Darwin 23 source)
        run: |
          cd UniXNU/out/nabu/tree
          mkdir -p refer
          if [ ! -d refer/IOStorageFamily/.git ]; then
            git clone --filter=blob:none https://github.com/apple-oss-distributions/IOStorageFamily.git refer/IOStorageFamily
          fi
          git -C refer/IOStorageFamily checkout -q e45fbe30a7879e0b16e26dddb78538f1b00e0bff
          echo "IOStorageFamily HEAD: $(git -C refer/IOStorageFamily rev-parse HEAD)"


      - name: Add post64 diagnostic checkpoints
        run: |
          python3 - <<'POST64'
          from pathlib import Path
          import ast
          import json
          import os
          
          # cmd_build() calls prepare()/tree.assemble() again. Patch the source
          # script so reassembly cannot copy an unmodified script over our probes.
          path = Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          text = path.read_text()
          
          def replace_once(old, new):
              global text
              assert text.count(old) == 1, f'Unexpected marker implementation: {old[:70]}'
              text = text.replace(old, new, 1)
          
          replace_once('static unsigned long long g_hits = 0;',
                       'static unsigned long long g_hits[2] = {0, 0};\nstatic int g_last_hit = 0;')
          replace_once('#define NABU_MAX_MARK 64', '#define NABU_MAX_MARK 98')
          replace_once('g_slot = 0; g_hits = 0;', 'g_slot = 0; g_hits[0] = 0; g_hits[1] = 0; g_last_hit = 0;')
          replace_once('g_hits |= (1ULL << (n - 1));',
                       'g_hits[(n - 1) / 64] |= (1ULL << ((n - 1) % 64));\n  g_last_hit = n;')
          assert text.count('g_hits & (1ULL << (n - 1))') == 4
          text = text.replace('g_hits & (1ULL << (n - 1))',
                              'g_hits[(n - 1) / 64] & (1ULL << ((n - 1) % 64))')
          replace_once('draw_number(32, (g_h > 900 ? g_h - 320 : 132), max_hit(), 20);',
                       'draw_number(32, (g_h > 900 ? g_h - 540 : 132), g_last_hit, 20);')
          # Keep max_hit referenced, avoiding a new unused-function warning.
          replace_once('static int max_hit(void)', 'static int __attribute__((unused)) max_hit(void)')
          
          injection = r'''
          # POST64_DIAGNOSTICS: preserve boot behaviour; add screen checkpoints only.
          def post64_replace(source, anchor, replacement, label):
              tag = '/* post64:' + label + ' */'
              if tag in source:
                  return source
              if source.count(anchor) != 1:
                  raise SystemExit('POST64 anchor mismatch: ' + label)
              return source.replace(anchor, replacement.replace('@TAG@', tag), 1)
          
          bi = io.open(bic, encoding='utf-8').read()
          for anchor, replacement, label in [
              ('\tbsd_autoconf();', '\tbsd_autoconf();\n\tNABU_MARK(66); @TAG@', 'bsd-autoconf-return'),
              ('\tinittodr(0);', '\tNABU_MARK(67); @TAG@\n\tinittodr(0);\n\tNABU_MARK(68);', 'clock-init'),
              ('\t\tsetconf();', '\t\tNABU_MARK(69); @TAG@\n\t\tsetconf();\n\t\tNABU_MARK(77);', 'setconf'),
              ('\terr = IOFindBSDRoot(rootdevice, sizeof(rootdevice), &rootdev, &flags);',
               '\terr = IOFindBSDRoot(rootdevice, sizeof(rootdevice), &rootdev, &flags);\n\tNABU_MARK(76); @TAG@', 'find-root-return'),
              ('\t\tif (0 == (err = vfs_mountroot())) {',
               '\t\tNABU_MARK(78); @TAG@\n\t\tif (0 == (err = vfs_mountroot())) {\n\t\t\tNABU_MARK(79);', 'mount-root'),
              ("\t\trootdevice[0] = '\\0';", "\t\tNABU_MARK(80); @TAG@\n\t\trootdevice[0] = '\\0';", 'mount-root-failed'),
          ]:
              bi = post64_replace(bi, anchor, replacement, label)
          io.open(bic, 'w', encoding='utf-8', newline='').write(bi)
          
          io_ = io.open(ioc, encoding='utf-8').read()
          for anchor, replacement, label in [
              ('\treturn kIOReturnSuccess;\n}\n\nvoid\nIOServicePublishResource',
               '\tNABU_MARK(65); @TAG@\n\treturn kIOReturnSuccess;\n}\n\nvoid\nIOServicePublishResource', 'iokit-bsd-return'),
              ('\t// stall here for anyone matching on the IOBSD resource to finish (filesystems)',
               '\tNABU_MARK(70); @TAG@\n\t// stall here for anyone matching on the IOBSD resource to finish (filesystems)', 'find-root-entry'),
              ('\tif ((service = IOService::waitForMatchingService(matching, 30ULL * kSecondScale))) {',
               '\tNABU_MARK(71); @TAG@\n\tif ((service = IOService::waitForMatchingService(matching, 30ULL * kSecondScale))) {', 'bsd-resource-wait'),
              ('\tmatching->release();\n\tmatching = NULL;\n\n\tif (mountAttempts++) {',
               '\tmatching->release();\n\tmatching = NULL;\n\tNABU_MARK(72); @TAG@\n\n\tif (mountAttempts++) {', 'bsd-resource-wait-return'),
              ('\t\tservice = IOService::waitForService( matching, &t );',
               '\t\tNABU_MARK(73); @TAG@\n\t\tservice = IOService::waitForService( matching, &t );\n\t\tNABU_MARK((service != NULL) ? 75 : 74);', 'root-service-wait'),
          ]:
              io_ = post64_replace(io_, anchor, replacement, label)
          io.open(ioc, 'w', encoding='utf-8', newline='').write(io_)
          
          # Paint before the existing panic/abort reporters touch format arguments.
          db = io.open(dbc, encoding='utf-8').read()
          db = post64_replace(db, '\t/* nabu_panic_hold: paint the format pointer and stop. */',
                              '\tNABU_MARK(90); @TAG@\n\t/* nabu_panic_hold: paint the format pointer and stop. */', 'panic-entered')
          io.open(dbc, 'w', encoding='utf-8', newline='').write(db)
          sl = io.open(slc, encoding='utf-8').read()
          sl = post64_replace(sl, '\t\tif (_ec == 0x24 || _ec == 0x25 || _ec == 0x20 || _ec == 0x21) {',
                              '\t\tif (_ec == 0x24 || _ec == 0x25 || _ec == 0x20 || _ec == 0x21) {\n\t\t\tNABU_MARK(91); @TAG@', 'abort-entered')
          io.open(slc, 'w', encoding='utf-8', newline='').write(sl)
          print('POST64_DIAGNOSTICS: checkpoints 65-80, 90, 91 installed')
          '''
          assert text.count('\nMKP\n') == 1
          text = text.replace('\nMKP\n', '\n' + injection + '\nMKP\n', 1)
          # Check the entire source-transformation heredoc, not only our appended code.
          block = text.split("<<'MKP'\n", 1)[1].split('\nMKP\n', 1)[0]
          ast.parse(block)
          path.write_text(text)
          assembled = Path('UniXNU/out/nabu/tree/scripts/build-xnu-4k-baseline.sh')
          assembled.write_text(text)
          assert path.read_bytes() == assembled.read_bytes()
          
          mapping = {
              'display': 'Latest checkpoint is the large number ABOVE the colour strip; lower numbers are older helper readouts',
              'parameters': 'Same 512 MiB window, same ADT and boot arguments as previous test',
              'checkpoints': {
                  '65': 'IOKitBSDInit about to return',
                  '66': 'bsd_autoconf returned to bsd_init',
                  '67': 'Before inittodr', '68': 'After inittodr',
                  '69': 'Before setconf', '70': 'Entered root-device discovery',
                  '71': 'Before waiting for IOBSD resource matching',
                  '72': 'IOBSD resource wait returned',
                  '73': 'Before waiting for matching root service',
                  '74': 'Root-service wait returned without a service',
                  '75': 'Root-service wait returned a service',
                  '76': 'IOFindBSDRoot returned to setconf',
                  '77': 'setconf returned', '78': 'Before vfs_mountroot',
                  '79': 'vfs_mountroot succeeded', '80': 'vfs_mountroot failed',
                  '90': 'Entered the existing panic diagnostic hold',
                  '91': 'Entered the existing synchronous abort diagnostic hold',
              },
          }
          Path(os.environ.get('GITHUB_WORKSPACE', '.'), 'post64-checkpoints.json').write_text(json.dumps(mapping, indent=2) + '\n')
          print('Post64 diagnostics prepared; no memory, driver or storage parameters changed.')
          POST64

      - name: Install nabu opt-in NOP diagnostic service
        run: |
          cat > UniXNU/scripts/nabu-ufs-register-probe.cpp <<'PROBE_CPP'
          // SPDX-License-Identifier: BSD-2-Clause-Patent
          // SM8150/nabu single NOP OUT / NOP IN test. Explicitly opt-in, manual boot.
          // Uses a dedicated DMA allocation; never accesses firmware queue memory.
          // Takes over only an idle UTRL, preserves SMMU routing, issues no SCSI/disk IO.
          // Leaves the allocation pinned and interrupts masked until a hardware reboot.
          #include <IOKit/IOService.h>
          #include <IOKit/IOPlatformExpert.h>
          #include <IOKit/IODeviceMemory.h>
          #include <IOKit/IOMemoryDescriptor.h>
          #include <pexpert/pexpert.h>
          #include <IOKit/IOLib.h>
          #include <IOKit/IOBufferMemoryDescriptor.h>
          #include <kern/task.h>

          extern "C" {
          void nabu_mark(int);
          void nabu_mark_text(const char *, unsigned int);
          volatile unsigned int nabu_ufs_register_probe_phase = 0;
          volatile unsigned int nabu_ufs_register_probe_hc_read = 0;
          volatile unsigned int nabu_ufs_survey_page = 0;
          volatile unsigned int nabu_ufs_survey_complete = 0;
          __attribute__((used)) char nabu_ufs_register_probe_signature[] = "nabu-ufs-nop-v2";
          }

          class NativeUfs : public IOService {
            OSDeclareDefaultStructors(NativeUfs)
          public:
            IOService *probe(IOService *provider, SInt32 *score) override;
            bool start(IOService *provider) override;
          };
          OSDefineMetaClassAndStructors(NativeUfs, IOService)

          static unsigned int selectedPage(void)
          {
            int enabled = 0, nop = 0;
            if (!PE_parse_boot_argn("nabu-ufs-register-probe", &enabled, sizeof(enabled)) || enabled != 1 ||
                !PE_parse_boot_argn("nabu-ufs-nop", &nop, sizeof(nop)) || nop != 1) return 0;
            return 1;
          }

          IOService *NativeUfs::probe(IOService *provider, SInt32 *score)
          {
            if (!selectedPage() || !OSDynamicCast(IOPlatformExpertDevice, provider)) {
              return nullptr;
            }
            if (score) {
              *score = 500;
            }
            return this;
          }

          static uintptr_t mapRegisters(uint64_t physical, uint64_t size,
                                       OSSharedPtr<IOMemoryMap> &keep)
          {
            IODeviceMemory *memory = IODeviceMemory::withRange(physical, size);
            if (!memory) {
              return 0;
            }
            keep = OSSharedPtr<IOMemoryMap>(
                memory->map(kIOMapAnywhere | kIOMapInhibitCache), OSNoRetain);
            memory->release();
            return keep ? static_cast<uintptr_t>(keep->getVirtualAddress()) : 0;
          }

          static uint32_t readRegister(uintptr_t base, unsigned int offset)
          {
            __asm__ volatile("dsb sy" ::: "memory");
            const uint32_t value = *reinterpret_cast<volatile const uint32_t *>(base + offset);
            __asm__ volatile("dsb sy" ::: "memory");
            return value;
          }

          static void showHex(const char *label, uint32_t value, unsigned int y)
          {
            // The painter accepts only image VAs. Keep its formatted line out of the stack.
            static char line[40];
            static const char hex[] = "0123456789ABCDEF";
            unsigned int n = 0;
            while (n < 20 && label[n]) {
              line[n] = label[n];
              ++n;
            }
            line[n++] = ' ';
            line[n++] = '0';
            line[n++] = 'x';
            for (unsigned int i = 0; i < 8; ++i) {
              line[n++] = hex[(value >> (28 - 4 * i)) & 15];
            }
            line[n] = 0;
            nabu_mark_text(line, y);
          }

          [[noreturn]] static void finish(const char *reason)
          {
            nabu_mark_text(reason, 1760);
            nabu_mark_text("REPORT COMPLETE - HOLD POWER TO RESTART", 1820);
            nabu_ufs_register_probe_phase = 6;
            nabu_ufs_survey_complete = 1;
            nabu_mark(96);
            __asm__ volatile("msr daifset, #0xf" ::: "memory");
            for (;;) {
              __asm__ volatile("wfe");
            }
          }


          // SPDX-License-Identifier: BSD-2-Clause-Patent
          // Nabu NOP-only transport. Shared verbatim by the kernel and host fault tests.
          // Requires uint8_t/uint32_t/uint64_t/uintptr_t; no XNU dependencies.
          namespace NabuNop {
          static constexpr unsigned dmaBytes = 16384, ucdOffset = 4096;
          static constexpr unsigned responseOffset = 512, responseBytes = 512;
          static constexpr uint32_t errorMask = 0x70884U; // UIC + link lost + DF/HCF/SBF/CEF
          static constexpr uint8_t tag = 0; // request slot 0

          enum class End : uint32_t {
            Passed = 0, BadDma = 1, NotReady = 2, Busy = 3, ExistingError = 4,
            AutoHibernate = 5, InterruptMask = 6, StopTimeout = 7,
            BaseReadback = 8, StartTimeout = 9, LateBusy = 10,
            TransferError = 11, TransferTimeout = 12, OcsError = 13,
            ResponseType = 14, ResponseTag = 15, ResponseHeader = 16,
            PostflightFault = 17
          };
          struct Report {
            uint32_t phase = 0, oldLow = 0, oldHigh = 0, oldRun = 0, oldIe = 0;
            uint32_t oldAhit = 0, oldIs = 0, cap = 0, version = 0;
            uint32_t polls = 0, doorbell = 0, interrupt = 0, ocs = 15;
            uint32_t response0 = 0, response1 = 0, response2 = 0;
            bool submitted = false;
          };
          static uint32_t be32(const uint8_t *p)
          {
            return (uint32_t(p[0]) << 24) | (uint32_t(p[1]) << 16) |
                   (uint32_t(p[2]) << 8) | p[3];
          }
          static void build(uint8_t *memory, uint64_t physical)
          {
            // Entire region belongs to this allocation. Never use firmware queue memory.
            for (unsigned i = 0; i < dmaBytes; ++i) memory[i] = 0;
            uint32_t *words = reinterpret_cast<uint32_t *>(memory);
            words[0] = 0x11000000U; // UFS storage command, interrupt requested, no data, no crypto
            words[2] = 15; // OCS invalid sentinel
            const uint64_t ucd = physical + ucdOffset;
            words[4] = uint32_t(ucd);
            words[5] = uint32_t(ucd >> 32);
            words[6] = (responseBytes / 4) | ((responseOffset / 4) << 16);
            words[7] = (1024U / 4) << 16; // zero PRDT entries
            memory[ucdOffset] = 0; // NOP OUT, NOT a SCSI command
            memory[ucdOffset + 3] = tag;
            for (unsigned i = 0; i < responseBytes; ++i)
              memory[ucdOffset + responseOffset + i] = 0xa5;
          }
          // Every loop has a hard iteration bound independent of timer calibration.
          // Port.delay() is a finite CPU NOP loop on hardware; no wall-time claim.
          template<class Port>
          static bool waitBit(Port &p, unsigned offset, uint32_t mask, uint32_t expected)
          {
            for (unsigned i = 0; i < 10000; ++i) {
              if ((p.read(offset) & mask) == expected) return true;
              p.delay();
            }
            return false;
          }
          template<class Port>
          static End run(Port &p, uint8_t *memory, uint64_t physical, Report &r)
          {
            r.phase = 1;
            r.cap = p.read(0x00); r.version = p.read(0x08);
            if (!memory || (reinterpret_cast<uintptr_t>(memory) & 4095U) ||
                !physical || (physical & 4095U) || physical > ~uint64_t(0) - dmaBytes ||
                (!(r.cap & (1U << 24)) && physical + dmaBytes > 0x100000000ULL))
              return End::BadDma;
            // Legacy UFSHCI 2.x/3.x only. No MCQ or legacy 1.1 command-type guessing.
            if (r.version < 0x200 || r.version > 0x300 ||
                !(p.read(0x34) & 1) || (p.read(0x30) & 0x3f) != 0x0f)
              return End::NotReady;
            if (p.read(0x58) || p.read(0x78)) return End::Busy;
            r.oldIs = p.read(0x20);
            if (r.oldIs & errorMask) return End::ExistingError;
            r.oldAhit = p.read(0x18);
            // Do not try to exit hibernation or change link power in this first transport test.
            if (r.oldAhit & 0x1fffU) return End::AutoHibernate;
            r.oldLow = p.read(0x50); r.oldHigh = p.read(0x54);
            r.oldRun = p.read(0x60); r.oldIe = p.read(0x24);
            build(memory, physical);
            p.toDevice(); // clean+invalidate BEFORE exposing the allocation to DMA
            r.phase = 2;
            // Last checks before the first MMIO store.
            if (p.read(0x58) || p.read(0x78)) return End::Busy;
            if (p.read(0x20) & errorMask) return End::ExistingError;
            p.write(0x24, 0);
            if (p.read(0x24) != 0) return End::InterruptMask;
            p.write(0x60, 0);
            if (!waitBit(p, 0x60, 1, 0)) return End::StopTimeout;
            if (p.read(0x58) || p.read(0x78)) return End::LateBusy;
            p.write(0x50, uint32_t(physical)); p.write(0x54, uint32_t(physical >> 32));
            if (p.read(0x50) != uint32_t(physical) || p.read(0x54) != uint32_t(physical >> 32))
              return End::BaseReadback;
            p.write(0x60, 1);
            if (!waitBit(p, 0x60, 1, 1) || !waitBit(p, 0x30, 0x3f, 0x0f))
              return End::StartTimeout;
            if (p.read(0x58) || p.read(0x78)) return End::LateBusy;
            if (p.read(0x20) & errorMask) return End::ExistingError;
            if (!p.mappingSafe()) return End::PostflightFault;
            p.write(0x20, 1); // acknowledge ONLY old transfer completion, never errors
            r.phase = 3;
            r.submitted = true;
            p.trace(10, 1); // before doorbell write (live trace is separate from global boot marks)
            p.write(0x58, 1); // the ONLY submission; no cancel/reset/retry/restore afterward
            p.trace(11, 1); // MMIO store and its trailing DSB have returned
            for (unsigned i = 0; i < 100000; ++i) {
              ++r.polls;
              p.trace(12, r.polls);
              r.doorbell = p.read(0x58);
              p.trace(13, r.doorbell);
              r.interrupt |= p.read(0x20);
              p.trace(14, r.interrupt);
              if (r.interrupt & errorMask) return End::TransferError;
              // Doorbell can clear before CPU observes that it was set. Require fresh OCS too.
              if (!r.doorbell) {
                p.trace(15, r.polls);
                p.fromDevice(); // invalidate ONLY, never write dirty lines over DMA results
                p.trace(16, r.polls);
                r.ocs = memory[8];
                p.trace(17, r.ocs);
                if (r.ocs != 15) {
                  r.phase = 4;
                  if (r.ocs != 0) return End::OcsError;
                  const uint8_t *rsp = memory + ucdOffset + responseOffset;
                  r.response0 = be32(rsp); r.response1 = be32(rsp + 4); r.response2 = be32(rsp + 8);
                  if (rsp[0] != 0x20) return End::ResponseType; // NOP IN
                  if (rsp[3] != tag) return End::ResponseTag;
                  if (rsp[1] || rsp[2] || rsp[4] || rsp[5] || rsp[6] || rsp[7] ||
                      rsp[8] || rsp[9] || rsp[10] || rsp[11]) return End::ResponseHeader;
                  if (!p.mappingSafe() || (p.read(0x20) & errorMask) || p.read(0x58) || p.read(0x78))
                    return End::PostflightFault;
                  return End::Passed;
                }
              }
              p.trace(18, r.polls);
              p.delay();
              p.trace(19, r.polls);
            }
            p.trace(21, r.polls);
            return End::TransferTimeout;
          }
          } // namespace NabuNop


          static constexpr uint64_t smmuBytes = 0x100000ULL;
          static constexpr uint32_t expectedSid = 0x300U;
          struct Mapping {
            uintptr_t base = 0;
            uint64_t context = 0, gr1 = 0;
            unsigned index = 0, bank = 0;
            uint32_t smr = 0, s2cr = 0, scr0 = 0, id0 = 0, id1 = 0, id2 = 0;
            uint32_t cbar = 0, cba2r = 0, control = 0;
            unsigned outputBits = 0;
          };
          static Mapping mapping;
          static IOBufferMemoryDescriptor *pinnedDma; // intentionally retained until reboot, also on timeout
          static uint8_t *dmaMemory;
          static uint64_t dmaPhysical;
          static unsigned cacheLine;
          static NabuNop::Report report;

          static uint32_t sr(uint64_t offset)
          {
            if (offset > smmuBytes - 4) finish("RESULT: SMMU REGISTER OUT OF WINDOW");
            return readRegister(mapping.base, static_cast<unsigned>(offset));
          }
          static bool readMapping(void)
          {
            mapping.id0 = sr(0x20); mapping.id1 = sr(0x24); mapping.id2 = sr(0x28);
            mapping.scr0 = sr(0x00);
            if (!mapping.id0 || mapping.id0 == 0xffffffffU || !mapping.id1 ||
                mapping.id1 == 0xffffffffU || !(mapping.id0 & (1U << 27))) return false;
            if ((mapping.scr0 & (1U << 3)) && !(mapping.id0 & (1U << 8))) return false;
            const bool extended = (mapping.id0 & (1U << 8)) && (mapping.scr0 & (1U << 3));
            const uint32_t mask = extended ? 0xffffU : 0x7fffU;
            unsigned matches = 0;
            for (unsigned i = 0; i < (mapping.id0 & 0xffU); ++i) {
              uint32_t smr = sr(0x800 + 4U * i), s2cr = sr(0xc00 + 4U * i);
              bool valid = extended ? (s2cr & (1U << 10)) : (smr & 0x80000000U);
              if (valid && !((smr ^ expectedSid) & mask & ~((smr >> 16) & mask))) {
                ++matches; mapping.index = i; mapping.smr = smr; mapping.s2cr = s2cr;
              }
            }
            if (matches != 1 || ((mapping.s2cr >> 16) & 3U) != 0) return false;
            const uint64_t page = (mapping.id1 & 0x80000000U) ? 0x10000ULL : 0x1000ULL;
            const unsigned globalPages = 1U << (((mapping.id1 >> 28) & 7U) + 1U);
            mapping.bank = mapping.s2cr & 0xffU; mapping.gr1 = page;
            if (mapping.bank >= (mapping.id1 & 0xffU)) return false;
            mapping.context = page * (globalPages + mapping.bank);
            if (mapping.context > smmuBytes - 0x6cULL) return false;
            mapping.cbar = sr(mapping.gr1 + 4U * mapping.bank);
            mapping.cba2r = sr(mapping.gr1 + 0x800 + 4U * mapping.bank);
            mapping.control = sr(mapping.context);
            // Match the route validated on nabu, without programming ANY SMMU register.
            if (mapping.bank != 1 || ((mapping.cbar >> 16) & 3U) != 1 ||
                !(mapping.cba2r & 1) || (mapping.control & 1) || (mapping.scr0 & 1)) return false;
            // ID2.OAS encoding (32,36,40,42,44,48); unknown encodings are refused.
            switch ((mapping.id2 >> 4) & 15U) {
              case 0: mapping.outputBits = 32; break;
              case 1: mapping.outputBits = 36; break;
              case 2: mapping.outputBits = 40; break;
              case 3: mapping.outputBits = 42; break;
              case 4: mapping.outputBits = 44; break;
              case 5: mapping.outputBits = 48; break;
              default: return false;
            }
            return !(sr(mapping.context + 0x58) & ~0x600U) && sr(0x48) == 0;
          }
          static bool mappingUnchanged(void)
          {
            return sr(0x00) == mapping.scr0 && sr(0x20) == mapping.id0 &&
              sr(0x24) == mapping.id1 && sr(0x28) == mapping.id2 &&
              sr(0x800 + 4U * mapping.index) == mapping.smr &&
              sr(0xc00 + 4U * mapping.index) == mapping.s2cr &&
              sr(mapping.gr1 + 4U * mapping.bank) == mapping.cbar &&
              sr(mapping.gr1 + 0x800 + 4U * mapping.bank) == mapping.cba2r &&
              sr(mapping.context) == mapping.control &&
              !(sr(mapping.context + 0x58) & ~0x600U) && sr(0x48) == 0;
          }
          struct HardwarePort {
            uintptr_t hc;
            uint32_t read(unsigned offset) { return readRegister(hc, offset); }
            uint32_t seenTrace = 0;
            void trace(unsigned step, uint32_t value) {
              // Print each stage once. The global BSD 73 marker can change independently.
              const uint32_t bit = 1U << step;
              if (seenTrace & bit) return;
              seenTrace |= bit;
              nabu_ufs_register_probe_phase = step;
              showHex("LIVE STEP", step, 1460);
              showHex("LIVE VALUE", value, 1520);
            }
            void write(unsigned offset, uint32_t value) {
              __asm__ volatile("dsb sy" ::: "memory");
              *reinterpret_cast<volatile uint32_t *>(hc + offset) = value;
              __asm__ volatile("dsb sy" ::: "memory");
            }
            void delay() {
              // Do not depend on the unqualified XNU timebase/IODelay implementation.
              // This is pacing only; the hard bound is the core's iteration count.
              for (unsigned i = 0; i < 64; ++i)
                __asm__ volatile("nop" ::: "memory");
            }
            bool mappingSafe() { return mappingUnchanged(); }
            void toDevice() {
              for (uintptr_t at = reinterpret_cast<uintptr_t>(dmaMemory),
                   end = at + NabuNop::dmaBytes; at < end; at += cacheLine)
                __asm__ volatile("dc civac, %0" :: "r"(at) : "memory");
              __asm__ volatile("dsb sy" ::: "memory");
            }
            void fromDevice() {
              __asm__ volatile("dsb sy" ::: "memory");
              for (uintptr_t at = reinterpret_cast<uintptr_t>(dmaMemory),
                   end = at + NabuNop::dmaBytes; at < end; at += cacheLine)
                __asm__ volatile("dc ivac, %0" :: "r"(at) : "memory");
              __asm__ volatile("dsb sy" ::: "memory");
            }
          };
          static const char *reason(NabuNop::End end)
          {
            using NabuNop::End;
            switch (end) {
              case End::Passed: return "RESULT: NOP IN VERIFIED - NO DISK IO";
              case End::BadDma: return "RESULT: DMA ADDRESS OR ALIGNMENT REJECTED";
              case End::NotReady: return "RESULT: HC VERSION OR READY STATE REJECTED";
              case End::Busy: return "RESULT: REQUESTS ACTIVE - NO NOP SENT";
              case End::ExistingError: return "RESULT: HC ERROR - NO NOP SENT";
              case End::AutoHibernate: return "RESULT: AUTO HIBERNATE - NOP SKIPPED";
              case End::InterruptMask: return "RESULT: INTERRUPT MASK READBACK FAILED";
              case End::StopTimeout: return "RESULT: QUEUE STOP POLL LIMIT";
              case End::BaseReadback: return "RESULT: OWN QUEUE BASE READBACK FAILED";
              case End::StartTimeout: return "RESULT: OWN QUEUE START POLL LIMIT";
              case End::LateBusy: return "RESULT: QUEUE BECAME BUSY - NOP SKIPPED";
              case End::TransferError: return "RESULT: NOP HC ERROR - DMA RETAINED";
              case End::TransferTimeout: return "RESULT: NOP POLL LIMIT - DMA RETAINED";
              case End::OcsError: return "RESULT: NOP OCS ERROR - DMA RETAINED";
              case End::ResponseType: return "RESULT: RESPONSE IS NOT NOP IN";
              case End::ResponseTag: return "RESULT: NOP RESPONSE TAG MISMATCH";
              case End::ResponseHeader: return "RESULT: NOP RESPONSE HEADER REJECTED";
              case End::PostflightFault: return "RESULT: SMMU OR POSTFLIGHT CHECK FAILED";
            }
            return "RESULT: UNKNOWN NOP RESULT";
          }
          bool NativeUfs::start(IOService *provider)
          {
            if (!selectedPage() || !IOService::start(provider)) return false;
            nabu_ufs_survey_page = 4;
            nabu_ufs_register_probe_phase = 1;
            nabu_mark(92);
            nabu_mark_text("NABU UFS NOP V2 - SINGLE COMMAND", 680);
            nabu_mark_text("NO SCSI - NO DISK DATA READ OR WRITE", 740);
            nabu_mark_text("STAGE: POWER AND CLOCK PREFLIGHT", 800);
            OSSharedPtr<IOMemoryMap> gccMap, hcMap, smmuMap;
            uintptr_t gcc = mapRegisters(0x00177000ULL, 0x1000ULL, gccMap);
            if (!gcc) finish("RESULT: GCC MAP FAILED");
            uint32_t gdsc = readRegister(gcc, 4), axi = readRegister(gcc, 0x10), ahb = readRegister(gcc, 0x14);
            if (!(gdsc & 0x80000000U) || !(axi & 1) || !(ahb & 1) ||
                (axi & 0x80000000U) || (ahb & 0x80000000U))
              finish("RESULT: CLOCK OR POWER GUARD - SKIPPED");
            nabu_mark(93);
            nabu_mark_text("STAGE: SMMU ROUTE PREFLIGHT", 800);
            mapping.base = mapRegisters(0x15000000ULL, smmuBytes, smmuMap);
            if (!mapping.base || !readMapping()) finish("RESULT: SMMU ROUTE OR FAULT GUARD - SKIPPED");
            HardwarePort port { mapRegisters(0x01d84000ULL, 0x3000ULL, hcMap) };
            if (!port.hc) finish("RESULT: HC MAP FAILED");
            nabu_ufs_register_probe_hc_read = 1;
            // Reject controller state before invoking the DMA allocator as well as in core.run().
            if (!(port.read(0x34) & 1) || (port.read(0x30) & 0x3fU) != 0x0fU ||
                port.read(0x58) || port.read(0x78) || (port.read(0x20) & NabuNop::errorMask))
              finish("RESULT: HC READY IDLE OR ERROR GUARD - SKIPPED");
            nabu_mark_text("STAGE: DEDICATED DMA ALLOCATION", 800);
            nabu_ufs_register_probe_phase = 2;
            uint64_t ctr;
            __asm__ volatile("mrs %0, ctr_el0" : "=r"(ctr));
            cacheLine = 4U << ((ctr >> 16) & 15U);
            if (cacheLine < 16 || cacheLine > 4096) finish("RESULT: CACHE LINE SIZE REJECTED");
            pinnedDma = IOBufferMemoryDescriptor::inTaskWithOptions(kernel_task,
                static_cast<IOOptionBits>(kIODirectionInOut) |
                static_cast<IOOptionBits>(kIOMemoryPhysicallyContiguous) |
                static_cast<IOOptionBits>(kIOMemoryMapperNone), NabuNop::dmaBytes, 4096);
            if (!pinnedDma || pinnedDma->prepare() != kIOReturnSuccess)
              finish("RESULT: DMA ALLOCATION OR PREPARE FAILED");
            dmaMemory = static_cast<uint8_t *>(pinnedDma->getBytesNoCopy());
            IOByteCount contiguous = 0;
            dmaPhysical = pinnedDma->getPhysicalSegment(0, &contiguous, kIOMemoryMapperNone);
            if (!dmaMemory || !dmaPhysical || (reinterpret_cast<uintptr_t>(dmaMemory) & 4095) ||
                (dmaPhysical & 4095) || contiguous < NabuNop::dmaBytes ||
                dmaPhysical > (1ULL << mapping.outputBits) - NabuNop::dmaBytes)
              finish("RESULT: DMA CONTIGUITY OR SMMU ADDRESS LIMIT");
            nabu_mark(94);
            if (!mappingUnchanged()) finish("RESULT: SMMU CHANGED BEFORE TAKEOVER");
            nabu_mark_text("STAGE: IDLE QUEUE TAKEOVER", 800);
            nabu_mark(95);
            nabu_mark_text("STAGE: NOP TRANSPORT - SEE LIVE STEP", 800);
            showHex("OWN DMA PA LO", static_cast<uint32_t>(dmaPhysical), 860);
            showHex("OWN DMA PA HI", static_cast<uint32_t>(dmaPhysical >> 32), 920);
            showHex("HC CAP BEFORE", port.read(0), 980);
            showHex("HC VERSION BEFORE", port.read(8), 1040);
            showHex("CACHE LINE BYTES", cacheLine, 1100);
            showHex("CONTEXT FSR BEFORE", sr(mapping.context + 0x58), 1160);
            showHex("DOORBELL BEFORE", port.read(0x58), 1220);
            showHex("INT STATUS BEFORE", port.read(0x20), 1280);
            showHex("GLOBAL GFSR BEFORE", sr(0x48), 1340);
            const NabuNop::End end = NabuNop::run(port, dmaMemory, dmaPhysical, report);
            nabu_mark(98);
            nabu_ufs_register_probe_phase = 12;
            nabu_mark_text("STAGE: NOP RESULT - REBOOT REQUIRED", 800);
            showHex("RESULT CODE", static_cast<uint32_t>(end), 860);
            showHex("TRANSPORT PHASE", report.phase, 920);
            showHex("OWN DMA PA LO", static_cast<uint32_t>(dmaPhysical), 980);
            showHex("OWN DMA PA HI", static_cast<uint32_t>(dmaPhysical >> 32), 1040);
            showHex("OLD UTRL BASE LO", report.oldLow, 1100);
            showHex("OLD UTRL BASE HI", report.oldHigh, 1160);
            showHex("HC STATUS NOW", port.read(0x30), 1220);
            showHex("INT STATUS SEEN", report.interrupt | port.read(0x20), 1280);
            showHex("DOORBELL NOW", port.read(0x58), 1340);
            showHex("UTRD OCS", report.ocs, 1400);
            showHex("NOP RSP WORD 0", report.response0, 1460);
            showHex("NOP RSP WORD 1", report.response1, 1520);
            showHex("CONTEXT FSR", sr(mapping.context + 0x58), 1580);
            showHex("GLOBAL GFSR", sr(0x48), 1640);
            showHex("POLL COUNT", report.polls, 1700);
            // No complete/release/reuse, no queue restoration, even after failed submission.
            finish(reason(end));
          }
          PROBE_CPP
          python3 - <<'PROBE_SETUP'
          from pathlib import Path
          import ast
          import shutil

          root = Path('UniXNU')


          def replace_once(path, old, new):
              content = path.read_text()
              assert content.count(old) == 1, (str(path), old[:100])
              path.write_text(content.replace(old, new, 1))


          compiler = root / 'scripts/build-arm-driver.py'
          replace_once(compiler, 'import argparse\n', 'import argparse\nimport os\n')
          content = compiler.read_text()
          anchor = next(line for line in content.splitlines() if line.startswith('source = ROOT /'))
          replace_once(compiler, anchor + '\n', anchor + '''
          if component == 'NativeUfs' and os.environ.get('XNU_NABU_UFS_REGISTER_PROBE') == '1':
              source = ROOT / 'scripts/nabu-ufs-register-probe.cpp'
              if not source.is_file():
                  raise SystemExit('Missing nabu register-only probe source')
          ''')
          ast.parse(compiler.read_text())

          # The bootstrap pass must leave compile records before libNativeUfs.a exists.
          builder = root / 'scripts/unixnu/kernel.py'
          replace_once(builder,
                       "'XNU_NATIVE_ARCH_TIMER': '0'}",
                       "'XNU_NATIVE_ARCH_TIMER': '0', 'XNU_NATIVE_UFS': '0'}")
          ast.parse(builder.read_text())

          baseline = root / 'scripts/build-xnu-4k-baseline.sh'
          replace_once(baseline,
                       '    if [ -f "$STORAGE_REF" ]; then\n',
                       '''    if [ "${XNU_NABU_UFS_REGISTER_PROBE:-0}" = 1 ]; then
                echo "nabu: register-only IOService; do not link IOBlockStorageDevice-reference.o"
              elif [ -f "$STORAGE_REF" ]; then
          ''')
          replace_once(baseline,
                       'if [ "${XNU_NATIVE_UFS:-0}" = 1 ] && [ -d "$ROOT/kits/VerifiedRoot" ]; then\n',
                       'if [ "${XNU_NATIVE_UFS:-0}" = 1 ] && [ "${XNU_NABU_UFS_REGISTER_PROBE:-0}" != 1 ] && [ -d "$ROOT/kits/VerifiedRoot" ]; then\n')

          # Make's existing identity omitted UFS. Its bootstrap-compiled personality table
          # could otherwise remain built with UFS=0 even though the final link has UFS=1.
          replace_once(baseline,
                       '  "${XNU_NATIVE_ADRENO:-0}" "$ROOT/build/native-adreno/libNativeAdreno.a" <<\'PY\'\n',
                       '  "${XNU_NATIVE_ADRENO:-0}" "$ROOT/build/native-adreno/libNativeAdreno.a" \\\n'
                       '  "${XNU_NATIVE_UFS:-0}" "$ROOT/build/native-ufs/libNativeUfs.a" <<\'PY\'\n')

          # build kernel reassembles scripts; keep original and assembled inputs identical.
          for relative in ('build-arm-driver.py', 'build-xnu-4k-baseline.sh', 'nabu-ufs-register-probe.cpp'):
              original = root / 'scripts' / relative
              assembled = root / 'out/nabu/tree/scripts' / relative
              shutil.copy2(original, assembled)
              assert original.read_bytes() == assembled.read_bytes()

          assert 'CONFIG_XNU_NATIVE_UFS=y' in (root / 'out/nabu/.config').read_text().splitlines()
          print('NABU_UFS_REGISTER_PROBE: IOService-only source selected; bootstrap UFS disabled.')
          print('NABU_UFS_REGISTER_PROBE: storage base-class object and VerifiedRoot stub excluded.')
          PROBE_SETUP
