name: Build nabu post64 diagnostics

on:
  push:
    paths:
      - .github/workflows/build-kernel-post64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350
    env:
      UNIXNU_DEBUG_LDFILELIST: "1"
      XNU_MAKE_V: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16
        run: |
          echo "=== available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo none
          # xnu-10063's MIG stubs must be generated by the oldest toolchain available:
          # newer iig emits IORPC.kernelContent / different reply-size metadata, and
          # mig_init() then trips "kroutine must have precise size" or overflows the
          # dispatch table. That is exactly where the boot was dying.
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | head -1)
          echo "picked: $XC"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $GITHUB_ENV
            echo "exported DEVELOPER_DIR=$XC/Contents/Developer"
          else
            echo "no Xcode 16 found"
          fi
          xcodebuild -version
          xcrun --find clang
      - name: Environment check
        run: |
          xcodebuild -version
          python3 --version
          uname -m
          df -h /

      - name: Clone UniXNU
        run: |
          git init UniXNU
          git -C UniXNU remote add origin https://github.com/Lux12138/UniXNU.git
          git -C UniXNU fetch --depth 1 origin eafa7e11ee63ac6a87b4a16019f51bcc1a980bb2
          git -C UniXNU checkout --detach FETCH_HEAD
          git -C UniXNU submodule update --init --recursive --depth 1
          git -C UniXNU rev-parse HEAD

      - name: Select defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig nabu_defconfig -D "$GITHUB_WORKSPACE"

      - name: Fetch sources
        run: cd UniXNU && ./unixnu fetch
        timeout-minutes: 60

      - name: Fetch IPSW
        run: cd UniXNU && ./unixnu ipsw fetch
        timeout-minutes: 60

      - name: Assemble tree
        run: cd UniXNU && ./unixnu tree
        timeout-minutes: 30

      - name: Pre-cache XNU headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd UniXNU/out/nabu/tree
          mkdir -p .cache/sources
          TAG="xnu-10063.121.3"
          TRUST_TAG="xnu-8796.101.5"
          SHORT=${TAG#xnu-}
          TSHORT=${TRUST_TAG#xnu-}
          echo "TAG=$TAG TRUST_TAG=$TRUST_TAG"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit/crypto?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-crypto-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/EXTERNAL_HEADERS/TrustCache?ref=$TRUST_TAG" \
            -o ".cache/sources/xnu-trustcache-$TSHORT.json"
          echo "=== cached json ==="
          ls -la .cache/sources/
      - name: Fetch IOStorageFamily (public Apple Darwin 23 source)
        run: |
          cd UniXNU/out/nabu/tree
          mkdir -p refer
          if [ ! -d refer/IOStorageFamily/.git ]; then
            git clone --filter=blob:none https://github.com/apple-oss-distributions/IOStorageFamily.git refer/IOStorageFamily
          fi
          git -C refer/IOStorageFamily checkout -q e45fbe30a7879e0b16e26dddb78538f1b00e0bff
          echo "IOStorageFamily HEAD: $(git -C refer/IOStorageFamily rev-parse HEAD)"


      - name: Add post64 diagnostic checkpoints
        run: |
          python3 - <<'POST64'
          from pathlib import Path
          import ast
          import json
          import os
          
          # cmd_build() calls prepare()/tree.assemble() again. Patch the source
          # script so reassembly cannot copy an unmodified script over our probes.
          path = Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          text = path.read_text()
          
          def replace_once(old, new):
              global text
              assert text.count(old) == 1, f'Unexpected marker implementation: {old[:70]}'
              text = text.replace(old, new, 1)
          
          replace_once('static unsigned long long g_hits = 0;',
                       'static unsigned long long g_hits[2] = {0, 0};\nstatic int g_last_hit = 0;')
          replace_once('#define NABU_MAX_MARK 64', '#define NABU_MAX_MARK 96')
          replace_once('g_slot = 0; g_hits = 0;', 'g_slot = 0; g_hits[0] = 0; g_hits[1] = 0; g_last_hit = 0;')
          replace_once('g_hits |= (1ULL << (n - 1));',
                       'g_hits[(n - 1) / 64] |= (1ULL << ((n - 1) % 64));\n  g_last_hit = n;')
          assert text.count('g_hits & (1ULL << (n - 1))') == 4
          text = text.replace('g_hits & (1ULL << (n - 1))',
                              'g_hits[(n - 1) / 64] & (1ULL << ((n - 1) % 64))')
          replace_once('draw_number(32, (g_h > 900 ? g_h - 320 : 132), max_hit(), 20);',
                       'draw_number(32, (g_h > 900 ? g_h - 540 : 132), g_last_hit, 20);')
          # Keep max_hit referenced, avoiding a new unused-function warning.
          replace_once('static int max_hit(void)', 'static int __attribute__((unused)) max_hit(void)')
          
          injection = r'''
          # POST64_DIAGNOSTICS: preserve boot behaviour; add screen checkpoints only.
          def post64_replace(source, anchor, replacement, label):
              tag = '/* post64:' + label + ' */'
              if tag in source:
                  return source
              if source.count(anchor) != 1:
                  raise SystemExit('POST64 anchor mismatch: ' + label)
              return source.replace(anchor, replacement.replace('@TAG@', tag), 1)
          
          bi = io.open(bic, encoding='utf-8').read()
          for anchor, replacement, label in [
              ('\tbsd_autoconf();', '\tbsd_autoconf();\n\tNABU_MARK(66); @TAG@', 'bsd-autoconf-return'),
              ('\tinittodr(0);', '\tNABU_MARK(67); @TAG@\n\tinittodr(0);\n\tNABU_MARK(68);', 'clock-init'),
              ('\t\tsetconf();', '\t\tNABU_MARK(69); @TAG@\n\t\tsetconf();\n\t\tNABU_MARK(77);', 'setconf'),
              ('\terr = IOFindBSDRoot(rootdevice, sizeof(rootdevice), &rootdev, &flags);',
               '\terr = IOFindBSDRoot(rootdevice, sizeof(rootdevice), &rootdev, &flags);\n\tNABU_MARK(76); @TAG@', 'find-root-return'),
              ('\t\tif (0 == (err = vfs_mountroot())) {',
               '\t\tNABU_MARK(78); @TAG@\n\t\tif (0 == (err = vfs_mountroot())) {\n\t\t\tNABU_MARK(79);', 'mount-root'),
              ("\t\trootdevice[0] = '\\0';", "\t\tNABU_MARK(80); @TAG@\n\t\trootdevice[0] = '\\0';", 'mount-root-failed'),
          ]:
              bi = post64_replace(bi, anchor, replacement, label)
          io.open(bic, 'w', encoding='utf-8', newline='').write(bi)
          
          io_ = io.open(ioc, encoding='utf-8').read()
          for anchor, replacement, label in [
              ('\treturn kIOReturnSuccess;\n}\n\nvoid\nIOServicePublishResource',
               '\tNABU_MARK(65); @TAG@\n\treturn kIOReturnSuccess;\n}\n\nvoid\nIOServicePublishResource', 'iokit-bsd-return'),
              ('\t// stall here for anyone matching on the IOBSD resource to finish (filesystems)',
               '\tNABU_MARK(70); @TAG@\n\t// stall here for anyone matching on the IOBSD resource to finish (filesystems)', 'find-root-entry'),
              ('\tif ((service = IOService::waitForMatchingService(matching, 30ULL * kSecondScale))) {',
               '\tNABU_MARK(71); @TAG@\n\tif ((service = IOService::waitForMatchingService(matching, 30ULL * kSecondScale))) {', 'bsd-resource-wait'),
              ('\tmatching->release();\n\tmatching = NULL;\n\n\tif (mountAttempts++) {',
               '\tmatching->release();\n\tmatching = NULL;\n\tNABU_MARK(72); @TAG@\n\n\tif (mountAttempts++) {', 'bsd-resource-wait-return'),
              ('\t\tservice = IOService::waitForService( matching, &t );',
               '\t\tNABU_MARK(73); @TAG@\n\t\tservice = IOService::waitForService( matching, &t );\n\t\tNABU_MARK((service != NULL) ? 75 : 74);', 'root-service-wait'),
          ]:
              io_ = post64_replace(io_, anchor, replacement, label)
          io.open(ioc, 'w', encoding='utf-8', newline='').write(io_)
          
          # Paint before the existing panic/abort reporters touch format arguments.
          db = io.open(dbc, encoding='utf-8').read()
          db = post64_replace(db, '\t/* nabu_panic_hold: paint the format pointer and stop. */',
                              '\tNABU_MARK(90); @TAG@\n\t/* nabu_panic_hold: paint the format pointer and stop. */', 'panic-entered')
          io.open(dbc, 'w', encoding='utf-8', newline='').write(db)
          sl = io.open(slc, encoding='utf-8').read()
          sl = post64_replace(sl, '\t\tif (_ec == 0x24 || _ec == 0x25 || _ec == 0x20 || _ec == 0x21) {',
                              '\t\tif (_ec == 0x24 || _ec == 0x25 || _ec == 0x20 || _ec == 0x21) {\n\t\t\tNABU_MARK(91); @TAG@', 'abort-entered')
          io.open(slc, 'w', encoding='utf-8', newline='').write(sl)
          print('POST64_DIAGNOSTICS: checkpoints 65-80, 90, 91 installed')
          '''
          assert text.count('\nMKP\n') == 1
          text = text.replace('\nMKP\n', '\n' + injection + '\nMKP\n', 1)
          # Check the entire source-transformation heredoc, not only our appended code.
          block = text.split("<<'MKP'\n", 1)[1].split('\nMKP\n', 1)[0]
          ast.parse(block)
          path.write_text(text)
          assembled = Path('UniXNU/out/nabu/tree/scripts/build-xnu-4k-baseline.sh')
          assembled.write_text(text)
          assert path.read_bytes() == assembled.read_bytes()
          
          mapping = {
              'display': 'Latest checkpoint is the large number ABOVE the colour strip; lower numbers are older helper readouts',
              'parameters': 'Same 512 MiB window, same ADT and boot arguments as previous test',
              'checkpoints': {
                  '65': 'IOKitBSDInit about to return',
                  '66': 'bsd_autoconf returned to bsd_init',
                  '67': 'Before inittodr', '68': 'After inittodr',
                  '69': 'Before setconf', '70': 'Entered root-device discovery',
                  '71': 'Before waiting for IOBSD resource matching',
                  '72': 'IOBSD resource wait returned',
                  '73': 'Before waiting for matching root service',
                  '74': 'Root-service wait returned without a service',
                  '75': 'Root-service wait returned a service',
                  '76': 'IOFindBSDRoot returned to setconf',
                  '77': 'setconf returned', '78': 'Before vfs_mountroot',
                  '79': 'vfs_mountroot succeeded', '80': 'vfs_mountroot failed',
                  '90': 'Entered the existing panic diagnostic hold',
                  '91': 'Entered the existing synchronous abort diagnostic hold',
              },
          }
          Path(os.environ.get('GITHUB_WORKSPACE', '.'), 'post64-checkpoints.json').write_text(json.dumps(mapping, indent=2) + '\n')
          print('Post64 diagnostics prepared; no memory, driver or storage parameters changed.')
          POST64

      - name: Build kernel

        run: |
          cd UniXNU
          # The tree was already assembled (and patched) by the "Assemble tree" step.
          # Re-running `unixnu tree` here applied the patches a second time, failed on
          # the ones that are not idempotent, and the `|| true` hid it -- leaving make to
          # build a half-patched tree. Build the tree that was actually assembled.
          ./unixnu build kernel
          ls -lh out/nabu/kernel/ || true
        timeout-minutes: 180

      - name: Verify generated diagnostic sources
        run: |
          python3 - <<'VERIFY'
          from pathlib import Path
          root = Path('UniXNU/out/nabu/tree/.cache/xnu-work')
          marker = (root / 'osfmk/arm/nabu_early_mark.c').read_text()
          assert '#define NABU_MAX_MARK 96' in marker
          assert 'g_hits[2]' in marker and 'g_last_hit, 20)' in marker
          expected = {
              'bsd/kern/bsd_init.c': ['bsd-autoconf-return', 'clock-init', 'setconf', 'find-root-return', 'mount-root', 'mount-root-failed'],
              'iokit/bsddev/IOKitBSDInit.cpp': ['iokit-bsd-return', 'find-root-entry', 'bsd-resource-wait', 'bsd-resource-wait-return', 'root-service-wait'],
              'osfmk/kern/debug.c': ['panic-entered'],
              'osfmk/arm64/sleh.c': ['abort-entered'],
          }
          for file, labels in expected.items():
              content = (root / file).read_text()
              for label in labels:
                  assert content.count('/* post64:' + label + ' */') == 1, (file, label)
          print('All post64 probes are present in generated sources.')
          VERIFY

      - name: Verify early checkpoint marks
        if: always()
        run: |
          echo "=== injection records in build logs ==="
          for f in UniXNU/out/nabu/logs/kernel.log UniXNU/out/nabu/logs/kernel-bootstrap.log; do
            if [ -f "$f" ]; then
              echo "--- $f"
              grep -a -E 'nabu pre-clean|marks inserted|WARN: mark' "$f" || echo "    (no mark record)"
            fi
          done
          echo "=== nabu symbols in the built mach-o ==="
          found=0
          while IFS= read -r k; do
            found=1
            echo "--- $k"
            ls -lh "$k"
            xcrun llvm-nm --defined-only "$k" 2>/dev/null | grep -i nabu_mark || echo "    (no nabu_mark symbol)"
          done < <(find UniXNU/out/nabu/kernel -name '*.macho' 2>/dev/null | head -5)
          [ "$found" = 1 ] || echo "(no mach-o in UniXNU/out/nabu/kernel)"

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "===== kernel.log (real build) ====="
          tail -250 UniXNU/out/nabu/logs/kernel.log 2>/dev/null || echo "(missing)"
          echo "===== kernel-bootstrap.log (record pass) ====="
          tail -60 UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null || echo "(missing)"
          echo "===== bootstrap errors (full file scan) ====="
          grep -a -nE 'error:|Error [0-9]|\*\*\*|undefined symbol|No such file|cannot find' \
            UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | head -25 || echo "(no error lines)"
          echo "===== bootstrap log size / tail of make output ====="
          wc -l UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null
          grep -a -nE 'make(\[[0-9]\])?:' UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | tail -10
          echo "===== where LDFILELIST is defined ====="
          cd UniXNU/out/nabu/tree/.cache/xnu-work 2>/dev/null && \
            grep -rn 'LDFILELIST' --include=Makefile* --include=*.cmd --include=*.def --include=*.top . 2>/dev/null | head -20
          echo "===== bsd filelist inputs present? ====="
          cd "$GITHUB_WORKSPACE/UniXNU/out/nabu/tree/.cache/xnu-work" 2>/dev/null && {
            ls -la bsd/conf/ 2>/dev/null | head -10
            echo "--- resolved bsd sources ---"
            ls build/obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT/*.o 2>/dev/null | wc -l
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nabu-post64
          path: |
            UniXNU/out/nabu/kernel/
            UniXNU/out/nabu/logs/
            post64-checkpoints.json
          if-no-files-found: warn



