name: Prepare nabu early kernel payload

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out pinned ADT generator
        uses: actions/checkout@v4
        with:
          repository: Lux12138/UniXNU
          ref: 48ea812633d59b796dee3dc0781b9e174075f457
          path: UniXNU-source
          persist-credentials: false

      - name: Download previously checked kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-nabu
          run-id: 39769932689
          github-token: ${{ github.token }}
          path: kernel-input

      - name: Check kernel and prepare staging directory
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          import struct
          from pathlib import Path

          candidates = list(Path('kernel-input').rglob('kernel.macho'))
          assert len(candidates) == 1, 'Expected exactly one kernel.macho'
          source = candidates[0]
          data = source.read_bytes()
          expected = '174aaf705a81c098e14f0048e04b311f8d4df5eedefc69244ba5aeaee8956138'
          assert hashlib.sha256(data).hexdigest() == expected, 'Kernel differs from checked artifact'
          magic, cpu, subtype, filetype, count, command_bytes = struct.unpack_from('<6I', data)
          assert (magic, cpu, subtype, filetype) == (0xfeedfacf, 0x100000c, 0, 2)
          end = 32 + command_bytes
          assert end <= len(data)
          offset = 32
          segments = []
          entry = None
          for _ in range(count):
              assert offset + 8 <= end
              command, length = struct.unpack_from('<II', data, offset)
              assert length >= 8 and length % 8 == 0 and offset + length <= end
              if command == 0x19:
                  assert length >= 72
                  address, size, file_offset, file_size = struct.unpack_from('<4Q', data, offset + 24)
                  sections = struct.unpack_from('<I', data, offset + 64)[0]
                  assert sections <= (length - 72) // 80
                  if size:
                      protection = struct.unpack_from('<I', data, offset + 60)[0]
                      assert size <= 0x10000000 and address + size < 1 << 64
                      assert file_size <= size and file_offset + file_size <= len(data)
                      segments.append((address, size, file_size, protection))
              elif command == 5:
                  assert entry is None and length == 288
                  assert struct.unpack_from('<II', data, offset + 8) == (6, 68)
                  entry = struct.unpack_from('<Q', data, offset + 272)[0]
              offset += length
          assert offset == end and entry is not None and 0 < len(segments) <= 64
          ordered = sorted(segments)
          assert all(a[0] + a[1] <= b[0] for a, b in zip(ordered, ordered[1:])), 'Overlapping segments'
          base = min(s[0] for s in segments)
          limit = max(s[0] + s[1] for s in segments)
          assert base % 4096 == 0 and entry % 4 == 0
          assert limit - base <= 0x10000000 - 0x200000
          assert any(a <= entry < a + f and p & 4 for a, _, f, p in segments)
          target = Path('stage/EFI/UniXNU/Payloads')
          target.mkdir(parents=True)
          shutil.copyfile(source, target / 'kernel.macho')
          Path('payload-output').mkdir()
          report = {
              'purpose': 'Early XNU experiment; no iPadOS userspace or root filesystem',
              'runtime_qualified': False,
              'abi_qualified': False,
              'kernel_source_run': 39769932689,
              'kernel_sha256': expected,
              'kernel_virtual_span_bytes': limit - base,
              'device_dram_bytes': 0x180000000,
              'requested_contiguous_window_bytes': 0x20000000,
              'window_address': 'Allocated from EfiConventionalMemory by DarwinBoot at runtime',
              'expected_cust_partition_bytes': 0x40000000,
              'observed_userdata_bytes': 0x1AB57BB000,
              'storage_layout_changes': 'None performed by this workflow',
          }
          Path('payload-output/payload-manifest.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Generate 6 GiB diagnostic ADT
        shell: bash
        run: |
          python3 UniXNU-source/scripts/make-nabu-adt.py \
            --dram-size 0x180000000 \
            --owned-memory-size 0x20000000 \
            --cpu-regs '0,0x100,0x200,0x300,0x400,0x500,0x600,0x700' \
            --output stage/EFI/UniXNU/Payloads/kernel.macho.adt

      - name: Create manual boot menu
        shell: bash
        run: |
          cat > stage/EFI/UniXNU/unixnu.toml <<'TOML'
          version = 1
          [boot]
          timeout = -1
          fallback_timeout = 120
          default = "return"
          rotate = 0
          [kits]
          autoload = false
          [ui]
          title = "nabu early XNU test"
          logo = true
          console = "auto"
          [[entry]]
          id = "return"
          title = "Return to firmware"
          type = "action"
          action = "exit"
          [[entry]]
          id = "xnu"
          title = "Experimental XNU - manual start"
          type = "xnu"
          path = "Payloads/kernel.macho"
          args = "serial=3 -enable_kprintf_spam"
          [[entry]]
          id = "restart"
          title = "Restart"
          type = "action"
          action = "reset"
          TOML

      - name: Install FAT image utilities
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends dosfstools mtools

      - name: Build and verify FAT payload image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GITHUB_WORKSPACE/payload-output/nabu-cust-payload.img"
          truncate -s 64M "$IMAGE"
          mkfs.vfat -F 16 -n NABUXNU "$IMAGE"
          mcopy -i "$IMAGE" -s stage/EFI ::/
          fsck.fat -n "$IMAGE"
          mkdir payload-readback
          mcopy -i "$IMAGE" -s ::/EFI payload-readback/
          diff -r stage/EFI payload-readback/EFI
          mdir -i "$IMAGE" -/ ::/EFI/UniXNU
          python3 - <<'PY'
          import hashlib
          import json
          import struct
          from pathlib import Path

          image = Path('payload-output/nabu-cust-payload.img')
          assert image.stat().st_size == 64 * 1024 * 1024
          tree = Path('stage/EFI/UniXNU/Payloads/kernel.macho.adt').read_bytes()
          nodes = {}
          def parse(offset=0, parent=''):
              properties, children = struct.unpack_from('<II', tree, offset)
              offset += 8
              values = {}
              for _ in range(properties):
                  key, length = struct.unpack_from('<32sI', tree, offset)
                  offset += 36
                  key = key.split(b'\0', 1)[0].decode()
                  assert offset + length <= len(tree)
                  values[key] = tree[offset:offset+length]
                  offset += (length + 3) & ~3
              name = values['name'].rstrip(b'\0').decode()
              path = parent + '/' + name
              nodes[path] = values
              for _ in range(children):
                  offset = parse(offset, path)
              return offset
          assert parse() == len(tree)
          chosen = nodes['/device-tree/chosen']
          assert struct.unpack('<Q', chosen['dram-size'])[0] == 0x180000000
          assert struct.unpack('<Q', chosen['darwinboot-memory-size'])[0] == 0x20000000
          memory = nodes['/device-tree/chosen/memory-map']
          assert not any(k in memory for k in ('RAMDisk', 'PackedRAMDisk', 'TrustCache'))
          report_path = Path('payload-output/payload-manifest.json')
          report = json.loads(report_path.read_text())
          report['files'] = {
              str(p): {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in [image, *sorted(Path('stage/EFI').rglob('*'))] if p.is_file()
          }
          report_path.write_text(json.dumps(report, indent=2) + '\n')
          print('FAT filesystem, file readback and ADT checks passed.')
          PY

      - name: Upload payload for review
        uses: actions/upload-artifact@v4
        with:
          name: nabu-early-kernel-payload
          if-no-files-found: error
          compression-level: 6
          path: payload-output/
