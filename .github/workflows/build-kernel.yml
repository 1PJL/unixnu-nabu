name: build-xnu-kernel

# 在 GitHub 的 macOS 机器上编译 UniXNU 的 XNU 内核（nabu 版）
# 触发方式：仓库页面 → Actions → build-xnu-kernel → Run workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350

    steps:
      - name: 检出设备仓库
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== Python ==="
          python3 --version
          echo "=== 磁盘 ==="
          df -h /
          echo "=== 架构 ==="
          uname -m

      - name: 克隆 UniXNU 主仓库
        run: |
          git clone --recurse-submodules --depth 1 --shallow-submodules \
            https://github.com/UniXNU/UniXNU.git UniXNU
          echo "=== 仓库大小 ==="
          du -sh UniXNU

      - name: 选择 defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig nabu_defconfig -D "$GITHUB_WORKSPACE"

      - name: 拉取源码依赖
        run: |
          cd UniXNU
          ./unixnu fetch
        timeout-minutes: 60

      - name: 拉取 IPSW 组件
        run: |
          cd UniXNU
          ./unixnu ipsw fetch
          echo "=== 磁盘剩余 ==="
          df -h /
        timeout-minutes: 60

      - name: 组装构建树
        run: |
          cd UniXNU
          ./unixnu tree
        timeout-minutes: 30

      - name: 预缓存 DriverKit 头文件清单（绕过 GitHub API 限流）
        run: |
          cd UniXNU/out/nabu/tree
          mkdir -p .cache/sources
          TAG="xnu-10063.121.3"
          SHORT="${TAG#xnu-}"
          echo "TAG=$TAG  SHORT=$SHORT"
          curl -sL --fail \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit?ref=${TAG}" \
            -o ".cache/sources/xnu-driverkit-${SHORT}.json"
          curl -sL --fail \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit/crypto?ref=${TAG}" \
            -o ".cache/sources/xnu-driverkit-crypto-${SHORT}.json"
          echo "=== 缓存文件 ==="
          ls -la .cache/sources/
          echo "=== 校验（前 100 字节）==="
          head -c 100 ".cache/sources/xnu-driverkit-${SHORT}.json"; echo

      - name: 编译 XNU 内核
        run: |
          cd UniXNU
          ./unixnu build kernel
          echo "=== 产物 ==="
          ls -lh out/nabu/kernel/ || true
        timeout-minutes: 180

      - name: 显示内核构建日志（失败时）
        if: failure()
        run: |
          echo "===== kernel-bootstrap.log ====="
          cat UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | tail -80 || echo "(文件不存在)"
          echo ""
          echo "===== logs 目录 ====="
          ls -la UniXNU/out/nabu/logs/ 2>/dev/null || echo "(目录不存在)"
          echo ""
          echo "===== out/nabu 结构 ====="
          find UniXNU/out/nabu -maxdepth 2 -type d 2>/dev/null | head -30

      - name: 上传 kernel.macho
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nabu
          path: |
            UniXNU/out/nabu/kernel/
            UniXNU/out/nabu/logs/
          if-no-files-found: warn
          retention-days: 30
