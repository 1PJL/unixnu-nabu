name: build-xnu-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Environment check
        run: |
          xcodebuild -version
          python3 --version
          uname -m
          df -h /

      - name: Clone UniXNU
        run: |
          git clone --recurse-submodules --depth 1 --shallow-submodules https://github.com/Lux12138/UniXNU.git UniXNU

      - name: Select defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig nabu_defconfig -D "$GITHUB_WORKSPACE"

      - name: Fetch sources
        run: cd UniXNU && ./unixnu fetch
        timeout-minutes: 60

      - name: Fetch IPSW
        run: cd UniXNU && ./unixnu ipsw fetch
        timeout-minutes: 60

      - name: Assemble tree
        run: cd UniXNU && ./unixnu tree
        timeout-minutes: 30

      - name: Inject GITHUB_TOKEN into API scripts
        run: |
          cd UniXNU/out/nabu/tree
          python3 - <<'PY'
          from pathlib import Path
          import os, glob
          token = os.environ.get("GITHUB_TOKEN", "")
          print("token present:", bool(token))
          patched = 0
          for f in glob.glob("scripts/*.py"):
              p = Path(f)
              s = p.read_text()
              if "api.github.com" not in s or "_UNIXNU_TOKEN_PATCH" in s:
                  continue
              if "import urllib.request" not in s:
                  continue
              patch = "import urllib.request\n_gh_token = __import__(\"os\").environ.get(\"GITHUB_TOKEN\", \"\")\nif _gh_token:\n    _orig_urlopen = urllib.request.urlopen\n    def _urlopen(url, *a, **kw):\n        req = urllib.request.Request(url) if isinstance(url, str) else url\n        req.add_header(\"Authorization\", \"Bearer \" + _gh_token)\n        req.add_header(\"Accept\", \"application/vnd.github+json\")\n        return _orig_urlopen(req, *a, **kw)\n    urllib.request.urlopen = _urlopen"
              s = s.replace("import urllib.request", patch, 1)
              p.write_text(s)
              patched += 1
              print("patched:", f)
          print("total:", patched)
          PY

      - name: Build kernel
        run: |
          cd UniXNU
          ./unixnu build kernel
          ls -lh out/nabu/kernel/ || true
        timeout-minutes: 180

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "===== kernel-bootstrap.log ====="
          tail -100 UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null || echo "(missing)"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nabu
          path: |
            UniXNU/out/nabu/kernel/
            UniXNU/out/nabu/logs/
          if-no-files-found: warn