name: build-xnu-kernel

# 在 GitHub 的 macOS 机器上编译 UniXNU 的 XNU 内核（nabu 版）
# 触发方式：仓库页面 → Actions → build-xnu-kernel → Run workflow

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350

    steps:
      - name: 检出设备仓库
        uses: actions/checkout@v4

      - name: 环境自检
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          echo "=== Python ==="
          python3 --version
          echo "=== 磁盘 ==="
          df -h /
          echo "=== 架构 ==="
          uname -m

      - name: 克隆 UniXNU 主仓库
        run: |
          git clone --recurse-submodules --depth 1 --shallow-submodules \
            https://github.com/UniXNU/UniXNU.git UniXNU
          echo "=== 仓库大小 ==="
          du -sh UniXNU

      - name: 选择 defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig nabu_defconfig -D "$GITHUB_WORKSPACE"

      - name: 拉取源码依赖
        run: |
          cd UniXNU
          ./unixnu fetch
        timeout-minutes: 60

      - name: 拉取 IPSW 组件
        run: |
          cd UniXNU
          ./unixnu ipsw fetch
          echo "=== 磁盘剩余 ==="
          df -h /
        timeout-minutes: 60

      - name: 组装构建树
        run: |
          cd UniXNU
          ./unixnu tree
        timeout-minutes: 30

      - name: 给 API 脚本注入 GITHUB_TOKEN（绕过匿名限流）
        run: |
          cd UniXNU/out/nabu/tree
          python3 - <<'PY'
          from pathlib import Path
          import os, glob
          token = os.environ.get("GITHUB_TOKEN", "")
          print("token present:", bool(token))
          patched = 0
          for f in glob.glob("scripts/*.py"):
              p = Path(f)
              s = p.read_text()
              if "api.github.com" not in s or "_UNIXNU_TOKEN_PATCH" in s:
                  continue
              if "import urllib.request" not in s:
                  continue
              patch = '''import urllib.request
# _UNIXNU_TOKEN_PATCH: authenticated opener for GitHub API
_gh_token = __import__("os").environ.get("GITHUB_TOKEN", "")
if _gh_token:
    _orig_urlopen = urllib.request.urlopen
    def _urlopen(url, *a, **kw):
        req = urllib.request.Request(url) if isinstance(url, str) else url
        req.add_header("Authorization", "Bearer " + _gh_token)
        req.add_header("Accept", "application/vnd.github+json")
        return _orig_urlopen(req, *a, **kw)
    urllib.request.urlopen = _urlopen'''
              s = s.replace("import urllib.request", patch, 1)
              p.write_text(s)
              patched += 1
              print("patched:", f)
          print("total patched:", patched)
          PY
          echo "=== 验证 ==="
          grep -c "_UNIXNU_TOKEN_PATCH" scripts/*.py 2>/dev/null || echo "(无匹配)"

      - name: 编译 XNU 内核
        run: |
          cd UniXNU
          ./unixnu build kernel
          echo "=== 产物 ==="
          ls -lh out/nabu/kernel/ || true
        timeout-minutes: 180

      - name: 显示内核构建日志（失败时）
        if: failure()
        run: |
          echo "===== kernel-bootstrap.log ====="
          cat UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | tail -80 || echo "(文件不存在)"
          echo ""
          echo "===== logs 目录 ====="
          ls -la UniXNU/out/nabu/logs/ 2>/dev/null || echo "(目录不存在)"
          echo ""
          echo "===== out/nabu 结构 ====="
          find UniXNU/out/nabu -maxdepth 2 -type d 2>/dev/null | head -30

      - name: 上传 kernel.macho
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nabu
          path: |
            UniXNU/out/nabu/kernel/
            UniXNU/out/nabu/logs/
          if-no-files-found: warn
          retention-days: 30
