name: Build nabu UFS register probe

on:
  push:
    paths:
      - .github/workflows/build-ufs-register-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 350
    outputs:
      kernel_sha256: ${{ steps.verify_ufs.outputs.kernel_sha256 }}
    env:
      UNIXNU_DEBUG_LDFILELIST: "1"
      XNU_MAKE_V: "1"
      XNU_NABU_UFS_REGISTER_PROBE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode 16
        run: |
          echo "=== available Xcode ==="
          ls -d /Applications/Xcode*.app 2>/dev/null || echo none
          # xnu-10063's MIG stubs must be generated by the oldest toolchain available:
          # newer iig emits IORPC.kernelContent / different reply-size metadata, and
          # mig_init() then trips "kroutine must have precise size" or overflows the
          # dispatch table. That is exactly where the boot was dying.
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | head -1)
          echo "picked: $XC"
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
            echo "DEVELOPER_DIR=$XC/Contents/Developer" >> $GITHUB_ENV
            echo "exported DEVELOPER_DIR=$XC/Contents/Developer"
          else
            echo "no Xcode 16 found"
          fi
          xcodebuild -version
          xcrun --find clang
      - name: Environment check
        run: |
          xcodebuild -version
          python3 --version
          uname -m
          df -h /

      - name: Clone UniXNU
        run: |
          git init UniXNU
          git -C UniXNU remote add origin https://github.com/Lux12138/UniXNU.git
          git -C UniXNU fetch --depth 1 origin eafa7e11ee63ac6a87b4a16019f51bcc1a980bb2
          git -C UniXNU checkout --detach FETCH_HEAD
          git -C UniXNU submodule update --init --recursive --depth 1
          git -C UniXNU rev-parse HEAD

      - name: Select defconfig
        run: |
          cd UniXNU
          chmod +x unixnu
          ./unixnu defconfig nabu_defconfig -D "$GITHUB_WORKSPACE"
          # Enable the IOService personality for THIS diagnostic build only.
          printf '\nCONFIG_XNU_NATIVE_UFS=y\n' >> out/nabu/.config

      - name: Fetch sources
        run: cd UniXNU && ./unixnu fetch
        timeout-minutes: 60

      - name: Fetch IPSW
        run: cd UniXNU && ./unixnu ipsw fetch
        timeout-minutes: 60

      - name: Assemble tree
        run: cd UniXNU && ./unixnu tree
        timeout-minutes: 30

      - name: Pre-cache XNU headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd UniXNU/out/nabu/tree
          mkdir -p .cache/sources
          TAG="xnu-10063.121.3"
          TRUST_TAG="xnu-8796.101.5"
          SHORT=${TAG#xnu-}
          TSHORT=${TRUST_TAG#xnu-}
          echo "TAG=$TAG TRUST_TAG=$TRUST_TAG"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/iokit/DriverKit/crypto?ref=$TAG" \
            -o ".cache/sources/xnu-driverkit-crypto-$SHORT.json"
          curl -sL --fail -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/apple-oss-distributions/xnu/contents/EXTERNAL_HEADERS/TrustCache?ref=$TRUST_TAG" \
            -o ".cache/sources/xnu-trustcache-$TSHORT.json"
          echo "=== cached json ==="
          ls -la .cache/sources/
      - name: Fetch IOStorageFamily (public Apple Darwin 23 source)
        run: |
          cd UniXNU/out/nabu/tree
          mkdir -p refer
          if [ ! -d refer/IOStorageFamily/.git ]; then
            git clone --filter=blob:none https://github.com/apple-oss-distributions/IOStorageFamily.git refer/IOStorageFamily
          fi
          git -C refer/IOStorageFamily checkout -q e45fbe30a7879e0b16e26dddb78538f1b00e0bff
          echo "IOStorageFamily HEAD: $(git -C refer/IOStorageFamily rev-parse HEAD)"


      - name: Add post64 diagnostic checkpoints
        run: |
          python3 - <<'POST64'
          from pathlib import Path
          import ast
          import json
          import os
          
          # cmd_build() calls prepare()/tree.assemble() again. Patch the source
          # script so reassembly cannot copy an unmodified script over our probes.
          path = Path('UniXNU/scripts/build-xnu-4k-baseline.sh')
          text = path.read_text()
          
          def replace_once(old, new):
              global text
              assert text.count(old) == 1, f'Unexpected marker implementation: {old[:70]}'
              text = text.replace(old, new, 1)
          
          replace_once('static unsigned long long g_hits = 0;',
                       'static unsigned long long g_hits[2] = {0, 0};\nstatic int g_last_hit = 0;')
          replace_once('#define NABU_MAX_MARK 64', '#define NABU_MAX_MARK 96')
          replace_once('g_slot = 0; g_hits = 0;', 'g_slot = 0; g_hits[0] = 0; g_hits[1] = 0; g_last_hit = 0;')
          replace_once('g_hits |= (1ULL << (n - 1));',
                       'g_hits[(n - 1) / 64] |= (1ULL << ((n - 1) % 64));\n  g_last_hit = n;')
          assert text.count('g_hits & (1ULL << (n - 1))') == 4
          text = text.replace('g_hits & (1ULL << (n - 1))',
                              'g_hits[(n - 1) / 64] & (1ULL << ((n - 1) % 64))')
          replace_once('draw_number(32, (g_h > 900 ? g_h - 320 : 132), max_hit(), 20);',
                       'draw_number(32, (g_h > 900 ? g_h - 540 : 132), g_last_hit, 20);')
          # Keep max_hit referenced, avoiding a new unused-function warning.
          replace_once('static int max_hit(void)', 'static int __attribute__((unused)) max_hit(void)')
          
          injection = r'''
          # POST64_DIAGNOSTICS: preserve boot behaviour; add screen checkpoints only.
          def post64_replace(source, anchor, replacement, label):
              tag = '/* post64:' + label + ' */'
              if tag in source:
                  return source
              if source.count(anchor) != 1:
                  raise SystemExit('POST64 anchor mismatch: ' + label)
              return source.replace(anchor, replacement.replace('@TAG@', tag), 1)
          
          bi = io.open(bic, encoding='utf-8').read()
          for anchor, replacement, label in [
              ('\tbsd_autoconf();', '\tbsd_autoconf();\n\tNABU_MARK(66); @TAG@', 'bsd-autoconf-return'),
              ('\tinittodr(0);', '\tNABU_MARK(67); @TAG@\n\tinittodr(0);\n\tNABU_MARK(68);', 'clock-init'),
              ('\t\tsetconf();', '\t\tNABU_MARK(69); @TAG@\n\t\tsetconf();\n\t\tNABU_MARK(77);', 'setconf'),
              ('\terr = IOFindBSDRoot(rootdevice, sizeof(rootdevice), &rootdev, &flags);',
               '\terr = IOFindBSDRoot(rootdevice, sizeof(rootdevice), &rootdev, &flags);\n\tNABU_MARK(76); @TAG@', 'find-root-return'),
              ('\t\tif (0 == (err = vfs_mountroot())) {',
               '\t\tNABU_MARK(78); @TAG@\n\t\tif (0 == (err = vfs_mountroot())) {\n\t\t\tNABU_MARK(79);', 'mount-root'),
              ("\t\trootdevice[0] = '\\0';", "\t\tNABU_MARK(80); @TAG@\n\t\trootdevice[0] = '\\0';", 'mount-root-failed'),
          ]:
              bi = post64_replace(bi, anchor, replacement, label)
          io.open(bic, 'w', encoding='utf-8', newline='').write(bi)
          
          io_ = io.open(ioc, encoding='utf-8').read()
          for anchor, replacement, label in [
              ('\treturn kIOReturnSuccess;\n}\n\nvoid\nIOServicePublishResource',
               '\tNABU_MARK(65); @TAG@\n\treturn kIOReturnSuccess;\n}\n\nvoid\nIOServicePublishResource', 'iokit-bsd-return'),
              ('\t// stall here for anyone matching on the IOBSD resource to finish (filesystems)',
               '\tNABU_MARK(70); @TAG@\n\t// stall here for anyone matching on the IOBSD resource to finish (filesystems)', 'find-root-entry'),
              ('\tif ((service = IOService::waitForMatchingService(matching, 30ULL * kSecondScale))) {',
               '\tNABU_MARK(71); @TAG@\n\tif ((service = IOService::waitForMatchingService(matching, 30ULL * kSecondScale))) {', 'bsd-resource-wait'),
              ('\tmatching->release();\n\tmatching = NULL;\n\n\tif (mountAttempts++) {',
               '\tmatching->release();\n\tmatching = NULL;\n\tNABU_MARK(72); @TAG@\n\n\tif (mountAttempts++) {', 'bsd-resource-wait-return'),
              ('\t\tservice = IOService::waitForService( matching, &t );',
               '\t\tNABU_MARK(73); @TAG@\n\t\tservice = IOService::waitForService( matching, &t );\n\t\tNABU_MARK((service != NULL) ? 75 : 74);', 'root-service-wait'),
          ]:
              io_ = post64_replace(io_, anchor, replacement, label)
          io.open(ioc, 'w', encoding='utf-8', newline='').write(io_)
          
          # Paint before the existing panic/abort reporters touch format arguments.
          db = io.open(dbc, encoding='utf-8').read()
          db = post64_replace(db, '\t/* nabu_panic_hold: paint the format pointer and stop. */',
                              '\tNABU_MARK(90); @TAG@\n\t/* nabu_panic_hold: paint the format pointer and stop. */', 'panic-entered')
          io.open(dbc, 'w', encoding='utf-8', newline='').write(db)
          sl = io.open(slc, encoding='utf-8').read()
          sl = post64_replace(sl, '\t\tif (_ec == 0x24 || _ec == 0x25 || _ec == 0x20 || _ec == 0x21) {',
                              '\t\tif (_ec == 0x24 || _ec == 0x25 || _ec == 0x20 || _ec == 0x21) {\n\t\t\tNABU_MARK(91); @TAG@', 'abort-entered')
          io.open(slc, 'w', encoding='utf-8', newline='').write(sl)
          print('POST64_DIAGNOSTICS: checkpoints 65-80, 90, 91 installed')
          '''
          assert text.count('\nMKP\n') == 1
          text = text.replace('\nMKP\n', '\n' + injection + '\nMKP\n', 1)
          # Check the entire source-transformation heredoc, not only our appended code.
          block = text.split("<<'MKP'\n", 1)[1].split('\nMKP\n', 1)[0]
          ast.parse(block)
          path.write_text(text)
          assembled = Path('UniXNU/out/nabu/tree/scripts/build-xnu-4k-baseline.sh')
          assembled.write_text(text)
          assert path.read_bytes() == assembled.read_bytes()
          
          mapping = {
              'display': 'Latest checkpoint is the large number ABOVE the colour strip; lower numbers are older helper readouts',
              'parameters': 'Same 512 MiB window, same ADT and boot arguments as previous test',
              'checkpoints': {
                  '65': 'IOKitBSDInit about to return',
                  '66': 'bsd_autoconf returned to bsd_init',
                  '67': 'Before inittodr', '68': 'After inittodr',
                  '69': 'Before setconf', '70': 'Entered root-device discovery',
                  '71': 'Before waiting for IOBSD resource matching',
                  '72': 'IOBSD resource wait returned',
                  '73': 'Before waiting for matching root service',
                  '74': 'Root-service wait returned without a service',
                  '75': 'Root-service wait returned a service',
                  '76': 'IOFindBSDRoot returned to setconf',
                  '77': 'setconf returned', '78': 'Before vfs_mountroot',
                  '79': 'vfs_mountroot succeeded', '80': 'vfs_mountroot failed',
                  '90': 'Entered the existing panic diagnostic hold',
                  '91': 'Entered the existing synchronous abort diagnostic hold',
              },
          }
          Path(os.environ.get('GITHUB_WORKSPACE', '.'), 'post64-checkpoints.json').write_text(json.dumps(mapping, indent=2) + '\n')
          print('Post64 diagnostics prepared; no memory, driver or storage parameters changed.')
          POST64

      - name: Install nabu register-only diagnostic service
        run: |
          cat > UniXNU/scripts/nabu-ufs-register-probe.cpp <<'PROBE_CPP'
          // SPDX-License-Identifier: BSD-2-Clause-Patent
          // nabu/SM8150 diagnostic service. This is deliberately NOT a block driver.
          // Only the explicit boot argument enables MMIO reads. No MMIO store, reset,
          // transfer-list setup, DMA, SCSI command or block-device publication occurs.
          #include <IOKit/IOService.h>
          #include <IOKit/IOPlatformExpert.h>
          #include <IOKit/IODeviceMemory.h>
          #include <IOKit/IOMemoryDescriptor.h>
          #include <pexpert/pexpert.h>

          extern "C" {
          void nabu_mark(int);
          void nabu_mark_text(const char *, unsigned int);
          volatile unsigned int nabu_ufs_register_probe_phase = 0;
          volatile unsigned int nabu_ufs_register_probe_hc_read = 0;
          __attribute__((used)) char nabu_ufs_register_probe_signature[] = "nabu-ufs-register-probe-v1";
          }

          class NativeUfs : public IOService {
            OSDeclareDefaultStructors(NativeUfs)
          public:
            IOService *probe(IOService *provider, SInt32 *score) override;
            bool start(IOService *provider) override;
          };
          OSDefineMetaClassAndStructors(NativeUfs, IOService)

          static bool requested(void)
          {
            int value = 0;
            return PE_parse_boot_argn("nabu-ufs-register-probe", &value, sizeof(value)) && value == 1;
          }

          IOService *NativeUfs::probe(IOService *provider, SInt32 *score)
          {
            // Reuse only the existing root-provider personality. The IOPlatformDevice
            // personality must not attach this board-specific diagnostic to another node.
            if (!requested() || !OSDynamicCast(IOPlatformExpertDevice, provider)) {
              return nullptr;
            }
            if (score) {
              *score = 500;
            }
            return this;
          }

          static uintptr_t mapRegisters(uint64_t physical, uint64_t size,
                                       OSSharedPtr<IOMemoryMap> &keep)
          {
            IODeviceMemory *memory = IODeviceMemory::withRange(physical, size);
            if (!memory) {
              return 0;
            }
            keep = OSSharedPtr<IOMemoryMap>(
                memory->map(kIOMapAnywhere | kIOMapInhibitCache), OSNoRetain);
            memory->release();
            return keep ? static_cast<uintptr_t>(keep->getVirtualAddress()) : 0;
          }

          static uint32_t readRegister(uintptr_t base, unsigned int offset)
          {
            __asm__ volatile("dsb sy" ::: "memory");
            const uint32_t value = *reinterpret_cast<volatile const uint32_t *>(base + offset);
            __asm__ volatile("dsb sy" ::: "memory");
            return value;
          }

          static void showHex(const char *label, uint32_t value, unsigned int y)
          {
            // Do not use the older decimal helper: its buffer is too short for long labels.
            // The diagnostic painter accepts only the kernel image's VA range. Kernel
            // stacks can live elsewhere, so keep the rendered line in the image's data.
            static char line[40];
            static const char hex[] = "0123456789ABCDEF";
            unsigned int n = 0;
            while (n < 20 && label[n]) {
              line[n] = label[n];
              ++n;
            }
            line[n++] = ' ';
            line[n++] = '0';
            line[n++] = 'x';
            for (unsigned int i = 0; i < 8; ++i) {
              line[n++] = hex[(value >> (28 - 4 * i)) & 15];
            }
            line[n] = 0;
            nabu_mark_text(line, y);
          }

          [[noreturn]] static void finish(const char *reason)
          {
            nabu_mark_text(reason, 1460);
            nabu_mark_text("TEST STOPPED - HOLD POWER TO RESTART", 1520);
            nabu_ufs_register_probe_phase = 6;
            nabu_mark(96);
            // A deliberate diagnostic stop, rather than a panic with variadic arguments.
            __asm__ volatile("msr daifset, #0xf" ::: "memory");
            for (;;) {
              __asm__ volatile("wfe");
            }
          }

          bool NativeUfs::start(IOService *provider)
          {
            if (!requested() || !IOService::start(provider)) {
              return false;
            }
            OSSharedPtr<IOMemoryMap> gccMap, hcMap;
            nabu_ufs_register_probe_phase = 1;
            nabu_mark(92);
            nabu_mark_text("NABU UFS REGISTER PROBE V1", 680);
            nabu_mark_text("MODE: REGISTER READS ONLY", 740);
            nabu_mark_text("STAGE: GCC MAP", 800);

            // SM8150: GCC base 0x00100000, UFS PHY clock page at offset 0x77000.
            // The nabu DT and Linux gcc-sm8150.c describe this controller/window.
            const uintptr_t gcc = mapRegisters(0x00177000ULL, 0x1000ULL, gccMap);
            if (!gcc) {
              finish("RESULT: GCC MAP FAILED");
            }
            nabu_ufs_register_probe_phase = 2;
            nabu_mark(93);
            nabu_mark_text("STAGE: GCC REGISTER READS", 800);
            const uint32_t gdsc = readRegister(gcc, 0x04);
            const uint32_t axi = readRegister(gcc, 0x10);
            const uint32_t ahb = readRegister(gcc, 0x14);
            const uint32_t aggre = readRegister(gcc, 0xc0);
            nabu_ufs_register_probe_phase = 3;
            nabu_mark(94);
            showHex("GCC GDSCR", gdsc, 860);
            showHex("GCC AXI", axi, 920);
            showHex("GCC AHB", ahb, 980);
            showHex("GCC AGGRE", aggre, 1040);

            // Conservative gate: do not touch the host unless power is on and both bus
            // clocks report enabled AND running. HW-gated idle clocks may fail this gate;
            // in that case the report is still useful and we do not try to wake them.
            const bool powered = (gdsc & 0x80000000U) != 0;
            const bool busRunning = (axi & 1U) && (ahb & 1U) &&
                !(axi & 0x80000000U) && !(ahb & 0x80000000U);
            if (!powered || !busRunning) {
              finish("RESULT: HC SKIPPED - POWER OR CLOCK GATE");
            }
            nabu_mark_text("STAGE: UFS HC MAP", 1100);
            const uintptr_t hc = mapRegisters(0x01d84000ULL, 0x3000ULL, hcMap);
            if (!hc) {
              finish("RESULT: HC MAP FAILED");
            }
            nabu_ufs_register_probe_phase = 4;
            nabu_mark(95);
            nabu_mark_text("STAGE: UFS HC REGISTER READS", 1100);
            // UFSHCI capability/version/status/enable are passive, read-only observations.
            const uint32_t cap = readRegister(hc, 0x00);
            const uint32_t version = readRegister(hc, 0x08);
            const uint32_t status = readRegister(hc, 0x30);
            const uint32_t enable = readRegister(hc, 0x34);
            nabu_ufs_register_probe_hc_read = 1;
            nabu_ufs_register_probe_phase = 5;
            showHex("HC CAP", cap, 1160);
            showHex("HC VERSION", version, 1220);
            showHex("HC STATUS", status, 1280);
            showHex("HC ENABLE", enable, 1340);
            finish("RESULT: HC REGISTERS READ - NO DISK IO");
          }
          PROBE_CPP
          python3 - <<'PROBE_SETUP'
          from pathlib import Path
          import ast
          import shutil

          root = Path('UniXNU')


          def replace_once(path, old, new):
              content = path.read_text()
              assert content.count(old) == 1, (str(path), old[:100])
              path.write_text(content.replace(old, new, 1))


          compiler = root / 'scripts/build-arm-driver.py'
          replace_once(compiler, 'import argparse\n', 'import argparse\nimport os\n')
          content = compiler.read_text()
          anchor = next(line for line in content.splitlines() if line.startswith('source = ROOT /'))
          replace_once(compiler, anchor + '\n', anchor + '''
          if component == 'NativeUfs' and os.environ.get('XNU_NABU_UFS_REGISTER_PROBE') == '1':
              source = ROOT / 'scripts/nabu-ufs-register-probe.cpp'
              if not source.is_file():
                  raise SystemExit('Missing nabu register-only probe source')
          ''')
          ast.parse(compiler.read_text())

          # The bootstrap pass must leave compile records before libNativeUfs.a exists.
          builder = root / 'scripts/unixnu/kernel.py'
          replace_once(builder,
                       "'XNU_NATIVE_ARCH_TIMER': '0'}",
                       "'XNU_NATIVE_ARCH_TIMER': '0', 'XNU_NATIVE_UFS': '0'}")
          ast.parse(builder.read_text())

          baseline = root / 'scripts/build-xnu-4k-baseline.sh'
          replace_once(baseline,
                       '    if [ -f "$STORAGE_REF" ]; then\n',
                       '''    if [ "${XNU_NABU_UFS_REGISTER_PROBE:-0}" = 1 ]; then
                echo "nabu: register-only IOService; do not link IOBlockStorageDevice-reference.o"
              elif [ -f "$STORAGE_REF" ]; then
          ''')
          replace_once(baseline,
                       'if [ "${XNU_NATIVE_UFS:-0}" = 1 ] && [ -d "$ROOT/kits/VerifiedRoot" ]; then\n',
                       'if [ "${XNU_NATIVE_UFS:-0}" = 1 ] && [ "${XNU_NABU_UFS_REGISTER_PROBE:-0}" != 1 ] && [ -d "$ROOT/kits/VerifiedRoot" ]; then\n')

          # Make's existing identity omitted UFS. Its bootstrap-compiled personality table
          # could otherwise remain built with UFS=0 even though the final link has UFS=1.
          replace_once(baseline,
                       '  "${XNU_NATIVE_ADRENO:-0}" "$ROOT/build/native-adreno/libNativeAdreno.a" <<\'PY\'\n',
                       '  "${XNU_NATIVE_ADRENO:-0}" "$ROOT/build/native-adreno/libNativeAdreno.a" \\\n'
                       '  "${XNU_NATIVE_UFS:-0}" "$ROOT/build/native-ufs/libNativeUfs.a" <<\'PY\'\n')

          # build kernel reassembles scripts; keep original and assembled inputs identical.
          for relative in ('build-arm-driver.py', 'build-xnu-4k-baseline.sh', 'nabu-ufs-register-probe.cpp'):
              original = root / 'scripts' / relative
              assembled = root / 'out/nabu/tree/scripts' / relative
              shutil.copy2(original, assembled)
              assert original.read_bytes() == assembled.read_bytes()

          assert 'CONFIG_XNU_NATIVE_UFS=y' in (root / 'out/nabu/.config').read_text().splitlines()
          print('NABU_UFS_REGISTER_PROBE: IOService-only source selected; bootstrap UFS disabled.')
          print('NABU_UFS_REGISTER_PROBE: storage base-class object and VerifiedRoot stub excluded.')
          PROBE_SETUP
          bash -n UniXNU/scripts/build-xnu-4k-baseline.sh
          python3 - <<'PROBE_MAPPING'
          from pathlib import Path
          import json
          p = Path('post64-checkpoints.json')
          m = json.loads(p.read_text())
          m['parameters'] = 'Same 6 GiB ADT and 512 MiB window; register-only IOService, gated by nabu-ufs-register-probe=1'
          m['checkpoints'].update({
              '92': 'Register-only probe entered',
              '93': 'GCC mapped; before clock/power register reads',
              '94': 'GCC register reads completed; before conditional host mapping',
              '95': 'Host mapped; before UFSHCI register reads',
              '96': 'Diagnostic report completed; deliberate stop, read RESULT line',
          })
          p.write_text(json.dumps(m, indent=2) + '\n')
          PROBE_MAPPING

      - name: Build kernel

        run: |
          cd UniXNU
          # The tree was already assembled (and patched) by the "Assemble tree" step.
          # Re-running `unixnu tree` here applied the patches a second time, failed on
          # the ones that are not idempotent, and the `|| true` hid it -- leaving make to
          # build a half-patched tree. Build the tree that was actually assembled.
          ./unixnu build kernel
          ls -lh out/nabu/kernel/ || true
        timeout-minutes: 180

      - name: Verify generated diagnostic sources
        run: |
          python3 - <<'VERIFY'
          from pathlib import Path
          root = Path('UniXNU/out/nabu/tree/.cache/xnu-work')
          marker = (root / 'osfmk/arm/nabu_early_mark.c').read_text()
          assert '#define NABU_MAX_MARK 96' in marker
          assert 'g_hits[2]' in marker and 'g_last_hit, 20)' in marker
          expected = {
              'bsd/kern/bsd_init.c': ['bsd-autoconf-return', 'clock-init', 'setconf', 'find-root-return', 'mount-root', 'mount-root-failed'],
              'iokit/bsddev/IOKitBSDInit.cpp': ['iokit-bsd-return', 'find-root-entry', 'bsd-resource-wait', 'bsd-resource-wait-return', 'root-service-wait'],
              'osfmk/kern/debug.c': ['panic-entered'],
              'osfmk/arm64/sleh.c': ['abort-entered'],
          }
          for file, labels in expected.items():
              content = (root / file).read_text()
              for label in labels:
                  assert content.count('/* post64:' + label + ' */') == 1, (file, label)
          print('All post64 probes are present in generated sources.')
          VERIFY

      - name: Verify linked register probe
        id: verify_ufs
        run: |
          python3 - <<'VERIFY_UFS'
          from pathlib import Path
          import hashlib
          import json
          import os
          import subprocess

          tree = Path('UniXNU/out/nabu/tree')
          build = tree / 'build/native-ufs'
          arguments = json.loads((build / 'compile-command.json').read_text())
          inputs = [Path(p) for p in arguments if p.endswith('/nabu-ufs-register-probe.cpp')]
          assert len(inputs) == 1, 'NativeUfs was not compiled from the register-only source'
          source = Path('UniXNU/scripts/nabu-ufs-register-probe.cpp')
          assert inputs[0].read_bytes() == source.read_bytes(), 'Compiled source changed during reassembly'
          obj = build / 'NativeUfs.o'
          object_symbols = subprocess.run(['xcrun', 'nm', str(obj)], check=True, capture_output=True, text=True).stdout
          assert 'NativeUfs' in object_symbols
          assert 'nabu_ufs_register_probe_phase' in object_symbols
          for forbidden in ('NativeUfsBlock', 'IOBlockStorageDevice', 'vr_open', 'vr_verify_block'):
              assert forbidden not in object_symbols, 'Unexpected storage implementation in probe: ' + forbidden

          personality = tree / 'build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/iokit/DEVELOPMENT/KernelConfigTables.cpo'
          recipe = json.loads(personality.with_suffix('.cpo.json').read_text().strip().rstrip(','))
          args = recipe['arguments']
          defines = {arg[2:] for arg in args if arg.startswith('-D') and len(arg) > 2}
          defines.update(args[i + 1] for i, arg in enumerate(args[:-1]) if arg == '-D')
          assert 'XNU_NATIVE_UFS=1' in defines, 'UFS enabled flag not found'
          assert b'NativeUfsRoot' in personality.read_bytes(), 'Root-provider personality is absent'

          log = Path('UniXNU/out/nabu/logs/kernel.log').read_text(errors='replace')
          links = [s for s in log.splitlines() if s.startswith('stub archive wired:')]
          assert len(links) == 1
          assert 'libNativeUfs.a' in links[0], 'Diagnostic service was not passed to final link'
          assert 'IOBlockStorageDevice-reference.o' not in links[0], 'Duplicate base class still linked'
          assert 'libVerifiedRootStub.a' not in links[0], 'Register probe must not link the unused empty policy stub'
          assert 'register-only IOService; do not link IOBlockStorageDevice-reference.o' in log

          kernel = Path('UniXNU/out/nabu/kernel/kernel.macho')
          data = kernel.read_bytes()
          symbols = subprocess.run(['xcrun', 'nm', '-g', '-U', str(kernel)], check=True, capture_output=True, text=True).stdout
          for required in ('NativeUfs', 'nabu_ufs_register_probe_phase', 'nabu_ufs_register_probe_hc_read'):
              assert required in symbols, 'Missing linked probe symbol: ' + required
          assert 'NativeUfsBlock' not in symbols
          assert b'nabu-ufs-register-probe-v1\0' in data
          sha = hashlib.sha256(data).hexdigest()
          report = {
              'purpose': 'SM8150/nabu register observation only; not block-device or root-filesystem bring-up',
              'kernel_sha256': sha,
              'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'upstream_commit': 'eafa7e11ee63ac6a87b4a16019f51bcc1a980bb2',
              'required_boot_argument': 'nabu-ufs-register-probe=1',
              'runtime_qualified': False,
              'scope_review': {
                  'controller_mmio_stores': 'No store operation in the diagnostic source',
                  'scsi_commands': 'None implemented',
                  'dma': 'None implemented',
                  'block_device_publication': 'None implemented',
                  'host_register_guard': 'GDSCR power-on and AXI/AHB enabled and running; otherwise skipped',
              },
              'linked_probe_object_symbol_checks': 'passed',
              'final_link_arguments_exclude_duplicate_storage_base': True,
              'stop': '96 means report complete; read the RESULT line. 92-95 identify probe access stages.',
          }
          Path('ufs-register-probe.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('kernel_sha256=' + sha + '\n')
          print(json.dumps(report, indent=2))
          VERIFY_UFS

      - name: Verify early checkpoint marks
        if: always()
        run: |
          echo "=== injection records in build logs ==="
          for f in UniXNU/out/nabu/logs/kernel.log UniXNU/out/nabu/logs/kernel-bootstrap.log; do
            if [ -f "$f" ]; then
              echo "--- $f"
              grep -a -E 'nabu pre-clean|marks inserted|WARN: mark' "$f" || echo "    (no mark record)"
            fi
          done
          echo "=== nabu symbols in the built mach-o ==="
          found=0
          while IFS= read -r k; do
            found=1
            echo "--- $k"
            ls -lh "$k"
            xcrun llvm-nm --defined-only "$k" 2>/dev/null | grep -i nabu_mark || echo "    (no nabu_mark symbol)"
          done < <(find UniXNU/out/nabu/kernel -name '*.macho' 2>/dev/null | head -5)
          [ "$found" = 1 ] || echo "(no mach-o in UniXNU/out/nabu/kernel)"

      - name: Dump build log on failure
        if: failure()
        run: |
          echo "===== kernel.log (real build) ====="
          tail -250 UniXNU/out/nabu/logs/kernel.log 2>/dev/null || echo "(missing)"
          echo "===== kernel-bootstrap.log (record pass) ====="
          tail -60 UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null || echo "(missing)"
          echo "===== bootstrap errors (full file scan) ====="
          grep -a -nE 'error:|Error [0-9]|\*\*\*|undefined symbol|No such file|cannot find' \
            UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | head -25 || echo "(no error lines)"
          echo "===== bootstrap log size / tail of make output ====="
          wc -l UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null
          grep -a -nE 'make(\[[0-9]\])?:' UniXNU/out/nabu/logs/kernel-bootstrap.log 2>/dev/null | tail -10
          echo "===== where LDFILELIST is defined ====="
          cd UniXNU/out/nabu/tree/.cache/xnu-work 2>/dev/null && \
            grep -rn 'LDFILELIST' --include=Makefile* --include=*.cmd --include=*.def --include=*.top . 2>/dev/null | head -20
          echo "===== bsd filelist inputs present? ====="
          cd "$GITHUB_WORKSPACE/UniXNU/out/nabu/tree/.cache/xnu-work" 2>/dev/null && {
            ls -la bsd/conf/ 2>/dev/null | head -10
            echo "--- resolved bsd sources ---"
            ls build/obj/DEVELOPMENT_ARM64_BCM2837/bsd/DEVELOPMENT/*.o 2>/dev/null | wc -l
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-nabu-ufs-register-probe
          path: |
            UniXNU/out/nabu/kernel/
            UniXNU/out/nabu/logs/
            post64-checkpoints.json
            ufs-register-probe.json
            UniXNU/scripts/nabu-ufs-register-probe.cpp
            UniXNU/out/nabu/tree/build/native-ufs/compile-command.json
            UniXNU/out/nabu/tree/build/native-ufs/compile.log
          if-no-files-found: warn

  prepare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_KERNEL_SHA256: ${{ needs.build.outputs.kernel_sha256 }}
    steps:
      - name: Check out pinned ADT generator
        uses: actions/checkout@v4
        with:
          repository: Lux12138/UniXNU
          ref: 48ea812633d59b796dee3dc0781b9e174075f457
          path: UniXNU-source
          persist-credentials: false

      - name: Download this run's checked register-probe kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-nabu-ufs-register-probe
          github-token: ${{ github.token }}
          path: kernel-input

      - name: Check kernel and prepare staging directory
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import json
          import shutil
          import struct
          from pathlib import Path

          candidates = list(Path('kernel-input').rglob('kernel.macho'))
          assert len(candidates) == 1, 'Expected exactly one kernel.macho'
          source = candidates[0]
          data = source.read_bytes()
          expected = os.environ['EXPECTED_KERNEL_SHA256']
          assert len(expected) == 64
          assert hashlib.sha256(data).hexdigest() == expected, 'Kernel differs from checked artifact'
          magic, cpu, subtype, filetype, count, command_bytes = struct.unpack_from('<6I', data)
          assert (magic, cpu, subtype, filetype) == (0xfeedfacf, 0x100000c, 0, 2)
          end = 32 + command_bytes
          assert end <= len(data)
          offset = 32
          segments = []
          entry = None
          for _ in range(count):
              assert offset + 8 <= end
              command, length = struct.unpack_from('<II', data, offset)
              assert length >= 8 and length % 8 == 0 and offset + length <= end
              if command == 0x19:
                  assert length >= 72
                  address, size, file_offset, file_size = struct.unpack_from('<4Q', data, offset + 24)
                  sections = struct.unpack_from('<I', data, offset + 64)[0]
                  assert sections <= (length - 72) // 80
                  if size:
                      protection = struct.unpack_from('<I', data, offset + 60)[0]
                      assert size <= 0x10000000 and address + size < 1 << 64
                      assert file_size <= size and file_offset + file_size <= len(data)
                      segments.append((address, size, file_size, protection))
              elif command == 5:
                  assert entry is None and length == 288
                  assert struct.unpack_from('<II', data, offset + 8) == (6, 68)
                  entry = struct.unpack_from('<Q', data, offset + 272)[0]
              offset += length
          assert offset == end and entry is not None and 0 < len(segments) <= 64
          ordered = sorted(segments)
          assert all(a[0] + a[1] <= b[0] for a, b in zip(ordered, ordered[1:])), 'Overlapping segments'
          base = min(s[0] for s in segments)
          limit = max(s[0] + s[1] for s in segments)
          assert base % 4096 == 0 and entry % 4 == 0
          assert limit - base <= 0x10000000 - 0x200000
          assert any(a <= entry < a + f and p & 4 for a, _, f, p in segments)
          target = Path('stage/EFI/UniXNU/Payloads')
          target.mkdir(parents=True)
          shutil.copyfile(source, target / 'kernel.macho')
          Path('payload-output').mkdir()
          mappings = list(Path('kernel-input').rglob('post64-checkpoints.json'))
          assert len(mappings) == 1, 'Expected the post64 checkpoint mapping'
          shutil.copyfile(mappings[0], 'payload-output/post64-checkpoints.json')
          probes = list(Path('kernel-input').rglob('ufs-register-probe.json'))
          assert len(probes) == 1
          assert json.loads(probes[0].read_text())['kernel_sha256'] == expected
          shutil.copyfile(probes[0], 'payload-output/ufs-register-probe.json')
          # Verify the new state variable is present in the linked symbol table.
          offset = 32
          found = False
          for _ in range(count):
              command, length = struct.unpack_from('<II', data, offset)
              if command == 2:
                  symoff, nsyms, stroff, strsize = struct.unpack_from('<4I', data, offset + 8)
                  strings = data[stroff:stroff+strsize]
                  index = strings.find(b'_g_last_hit\0')
                  if index >= 0:
                      found = any(i == index and t & 0x0e == 0x0e
                                  for i, t, section, desc, value in struct.iter_unpack(
                                      '<IBBHQ', data[symoff:symoff+nsyms*16]))
              offset += length
          assert found, 'Post64 diagnostic state is missing from the kernel'
          report = {
              'purpose': 'Read-only UFS register diagnostic; no userspace or root filesystem',
              'runtime_qualified': False,
              'abi_qualified': False,
              'kernel_source_run': int(os.environ['GITHUB_RUN_ID']),
              'kernel_sha256': expected,
              'kernel_virtual_span_bytes': limit - base,
              'device_dram_bytes': 0x180000000,
              'requested_contiguous_window_bytes': 0x20000000,
              'window_address': 'Allocated from EfiConventionalMemory by DarwinBoot at runtime',
              'expected_cust_partition_bytes': 0x40000000,
              'observed_userdata_bytes': 0x1AB57BB000,
              'storage_layout_changes': 'None performed by this workflow',
          }
          Path('payload-output/payload-manifest.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Generate 6 GiB diagnostic ADT
        shell: bash
        run: |
          python3 UniXNU-source/scripts/make-nabu-adt.py \
            --dram-size 0x180000000 \
            --owned-memory-size 0x20000000 \
            --cpu-regs '0,0x100,0x200,0x300,0x400,0x500,0x600,0x700' \
            --output stage/EFI/UniXNU/Payloads/kernel.macho.adt

      - name: Create manual boot menu
        shell: bash
        run: |
          cat > stage/EFI/UniXNU/unixnu.toml <<'TOML'
          version = 1
          [boot]
          timeout = -1
          fallback_timeout = 120
          default = "return"
          rotate = 0
          [kits]
          autoload = false
          [ui]
          title = "nabu UFS register probe"
          logo = true
          console = "auto"
          [[entry]]
          id = "return"
          title = "Return to firmware"
          type = "action"
          action = "exit"
          [[entry]]
          id = "xnu"
          title = "UFS register probe - manual start"
          type = "xnu"
          path = "Payloads/kernel.macho"
          args = "serial=3 -enable_kprintf_spam nabu-ufs-register-probe=1"
          [[entry]]
          id = "restart"
          title = "Restart"
          type = "action"
          action = "reset"
          TOML

      - name: Install FAT image utilities
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends dosfstools mtools

      - name: Build and verify FAT payload image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$GITHUB_WORKSPACE/payload-output/nabu-cust-ufs-register-probe.img"
          truncate -s 64M "$IMAGE"
          mkfs.vfat -F 16 -n NABUXNU "$IMAGE"
          mcopy -i "$IMAGE" -s stage/EFI ::/
          fsck.fat -n "$IMAGE"
          mkdir payload-readback
          mcopy -i "$IMAGE" -s ::/EFI payload-readback/
          diff -r stage/EFI payload-readback/EFI
          mdir -i "$IMAGE" -/ ::/EFI/UniXNU
          python3 - <<'PY'
          import hashlib
          import json
          import struct
          from pathlib import Path

          image = Path('payload-output/nabu-cust-ufs-register-probe.img')
          assert image.stat().st_size == 64 * 1024 * 1024
          tree = Path('stage/EFI/UniXNU/Payloads/kernel.macho.adt').read_bytes()
          nodes = {}
          def parse(offset=0, parent=''):
              properties, children = struct.unpack_from('<II', tree, offset)
              offset += 8
              values = {}
              for _ in range(properties):
                  key, length = struct.unpack_from('<32sI', tree, offset)
                  offset += 36
                  key = key.split(b'\0', 1)[0].decode()
                  assert offset + length <= len(tree)
                  values[key] = tree[offset:offset+length]
                  offset += (length + 3) & ~3
              name = values['name'].rstrip(b'\0').decode()
              path = parent + '/' + name
              nodes[path] = values
              for _ in range(children):
                  offset = parse(offset, path)
              return offset
          assert parse() == len(tree)
          chosen = nodes['/device-tree/chosen']
          assert struct.unpack('<Q', chosen['dram-size'])[0] == 0x180000000
          assert struct.unpack('<Q', chosen['darwinboot-memory-size'])[0] == 0x20000000
          memory = nodes['/device-tree/chosen/memory-map']
          assert not any(k in memory for k in ('RAMDisk', 'PackedRAMDisk', 'TrustCache'))
          report_path = Path('payload-output/payload-manifest.json')
          report = json.loads(report_path.read_text())
          report['files'] = {
              str(p): {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
              for p in [image, *sorted(Path('stage/EFI').rglob('*'))] if p.is_file()
          }
          report_path.write_text(json.dumps(report, indent=2) + '\n')
          print('FAT filesystem, file readback and ADT checks passed.')
          PY

      - name: Upload payload for review
        uses: actions/upload-artifact@v4
        with:
          name: nabu-ufs-register-probe-payload
          if-no-files-found: error
          compression-level: 6
          path: payload-output/
