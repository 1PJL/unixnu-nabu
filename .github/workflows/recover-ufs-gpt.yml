# Generated by scripts/make-nabu-gpt-recovery.py; standalone, no repository scripts required.
name: Recover nabu GPT payload
'on':
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Completed Build nabu UFS GPT v1 run with successful tests and kernel build
        required: true
        type: string
        default: '39935054102'
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
    steps:
    - name: Validate completed source build and artifact origin
      id: origin
      env:
        GH_TOKEN: ${{ github.token }}
        REPOSITORY: ${{ github.repository }}
      run: |
        python3 - <<'ORIGIN'
        import json
        import os
        import re
        import urllib.request
        from pathlib import Path

        repo = os.environ['REPOSITORY']
        run_id = os.environ['SOURCE_RUN_ID']
        assert re.fullmatch(r'[1-9][0-9]*', run_id), 'Invalid source run ID'
        def get(endpoint):
            request = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint,
                headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                         'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
            with urllib.request.urlopen(request, timeout=60) as response:
                return json.load(response)
        run = get('/actions/runs/' + run_id)
        assert run['status'] == 'completed', 'Source build must finish first'
        assert run['path'] == '.github/workflows/build-ufs-gpt.yml', 'Wrong source workflow'
        assert run['head_repository']['full_name'].lower() == repo.lower(), 'Foreign repository source'
        jobs = get('/actions/runs/' + run_id + '/attempts/' + str(run['run_attempt']) + '/jobs?per_page=100')
        assert jobs['total_count'] <= 100
        builds = [job for job in jobs['jobs'] if job['name'] == 'build']
        assert len(builds) == 1
        steps = {step['name']: step for step in builds[0]['steps']}
        for name in ('Test GPT transport parser and fixed report',
                     'Test NOP SMMU preflight with simulated registers', 'Build kernel',
                     'Verify generated diagnostic sources', 'Upload artifacts'):
            assert steps.get(name, {}).get('conclusion') == 'success', 'Required source step did not pass: ' + name
        assert 'Verify linked one-boot GPT diagnostic' in steps
        artifacts = get('/actions/runs/' + run_id + '/artifacts?per_page=100')
        assert artifacts['total_count'] <= 100
        matches = [a for a in artifacts['artifacts'] if a['name'] == 'kernel-nabu-ufs-gpt-v1' and not a['expired']]
        assert len(matches) == 1, 'Expected one unexpired kernel artifact'
        artifact = matches[0]
        assert artifact['workflow_run']['id'] == int(run_id)
        assert artifact['workflow_run']['head_sha'] == run['head_sha']
        report = {'source_run_id': int(run_id), 'source_attempt': run['run_attempt'],
                  'source_head_sha': run['head_sha'], 'repository': repo,
                  'artifact_id': artifact['id'], 'artifact_digest': artifact.get('digest'),
                  'recovery_run_id': int(os.environ['GITHUB_RUN_ID']),
                  'required_source_steps': 'passed'}
        Path('recovery-origin.json').write_text(json.dumps(report, indent=2) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
            out.write('artifact_id=' + str(artifact['id']) + '\n')
        print(json.dumps(report, indent=2))
        ORIGIN
    - name: Download existing kernel without rebuilding
      uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ steps.origin.outputs.artifact_id }}
        run-id: ${{ inputs.source_run_id }}
        github-token: ${{ github.token }}
        path: kernel-input
        merge-multiple: true
    - name: Recheck source object personality and linked kernel
      id: audit
      run: |
        python3 - <<'AUDIT'
        from pathlib import Path
        import hashlib
        import json
        import os

        def macho_symbols(path, *, public=False, filetype=None):
            import struct
            data = path.read_bytes()
            assert len(data) >= 32, 'Truncated Mach-O: ' + str(path)
            magic, cpu, subtype, kind, count, size = struct.unpack_from('<6I', data)
            assert (magic, cpu, subtype) == (0xfeedfacf, 0x100000c, 0)
            assert kind == filetype if filetype is not None else kind in (1, 2)
            end = 32 + size
            assert end <= len(data) and count <= size // 8
            offset, table = 32, None
            for _ in range(count):
                assert offset + 8 <= end
                command, length = struct.unpack_from('<II', data, offset)
                assert length >= 8 and length % 8 == 0 and offset + length <= end
                if command == 2:
                    assert table is None and length == 24, 'Invalid symbol table'
                    table = struct.unpack_from('<4I', data, offset + 8)
                offset += length
            assert offset == end and table is not None
            symoff, nsyms, stroff, strsize = table
            assert symoff + nsyms * 16 <= len(data) and stroff + strsize <= len(data)
            strings = data[stroff:stroff + strsize]
            names = []
            for index, typ, section, desc, value in struct.iter_unpack('<IBBHQ', data[symoff:symoff + nsyms * 16]):
                assert index < strsize
                stop = strings.find(b'\0', index)
                assert stop >= index
                if typ & 0xe0:
                    continue
                if public and not (typ & 1 and typ & 0x0e == 0x0e and section):
                    continue
                names.append(strings[index:stop].decode('utf-8', errors='replace'))
            return '\n'.join(names)


        def one(name):
            matches = list(Path('kernel-input').rglob(name))
            assert len(matches) == 1, 'Expected exactly one artifact file: ' + name
            return matches[0]
        arguments = json.loads((one('compile-command.json')).read_text())
        inputs = [Path(p) for p in arguments if p.endswith('/nabu-ufs-register-probe.cpp')]
        assert len(inputs) == 1, 'NativeUfs was not compiled from the register-only source'
        source = one('nabu-ufs-register-probe.cpp')
        assert hashlib.sha256(source.read_bytes()).hexdigest() == 'ece7374c700d51e513b57ab11dc805c1139934c7e6ee88c766f7262a3382cadd', 'Source differs from qualified GPT v1 source'
        obj = one('NativeUfs.o')
        object_symbols = macho_symbols(obj, filetype=1)
        assert 'NativeUfs' in object_symbols
        assert 'nabu_ufs_register_probe_phase' in object_symbols
        for forbidden in ('NativeUfsBlock', 'IOBlockStorageDevice', 'vr_open', 'vr_verify_block'):
            assert forbidden not in object_symbols, 'Unexpected storage implementation in probe: ' + forbidden

        personality = one('KernelConfigTables.cpo')
        recipe = json.loads(personality.with_suffix('.cpo.json').read_text().strip().rstrip(','))
        # Clang's -MJ compile record can normalize -DNAME=value into TWO arguments:
        # ["-D", "NAME=value"]. Accept both spellings; require the same exact value.
        recorded_arguments = recipe['arguments']
        defines = {arg[2:] for arg in recorded_arguments if arg.startswith('-D') and len(arg) > 2}
        defines.update(recorded_arguments[index + 1]
                       for index, arg in enumerate(recorded_arguments[:-1]) if arg == '-D')
        assert 'XNU_NATIVE_UFS=1' in defines, 'Final personality table is missing XNU_NATIVE_UFS=1; recorded defines: ' + repr(sorted(defines))
        print('Final personality table: XNU_NATIVE_UFS=1 (normalized compiler record checked)')
        assert b'NativeUfsRoot' in personality.read_bytes(), 'Root-provider personality is absent'

        log = one('kernel.log').read_text(errors='replace')
        links = [s for s in log.splitlines() if s.startswith('stub archive wired:')]
        assert len(links) == 1
        assert 'libNativeUfs.a' in links[0], 'Diagnostic service was not passed to final link'
        assert 'IOBlockStorageDevice-reference.o' not in links[0], 'Duplicate base class still linked'
        assert 'libVerifiedRootStub.a' not in links[0], 'Register probe must not link the unused empty policy stub'
        assert 'register-only IOService; do not link IOBlockStorageDevice-reference.o' in log

        kernel = one('kernel.macho')
        data = kernel.read_bytes()
        symbols = macho_symbols(kernel, public=True, filetype=2)
        for required in ('NativeUfs', 'nabu_ufs_register_probe_phase', 'nabu_ufs_register_probe_hc_read', 'nabu_ufs_survey_page', 'nabu_ufs_survey_complete', 'nabu_report_begin', 'nabu_report_line'):
            assert required in symbols, 'Missing linked probe symbol: ' + required
        assert 'NativeUfsBlock' not in symbols
        assert b'nabu-ufs-gpt-v1\0' in data
        assert b'NABU GPT V1 - READ ONLY - LUN 0 - ONE COMPLETE REPORT' in data
        assert b'PARTITION LIST NOT VALIDATED - SEE RESULT / IO / STAGE ABOVE' in data, 'Missing GPT failure-report text'
        # Short field labels can become immediate character stores after inlining.
        # Their rendering is tested by the report harness, not by string-pool layout.
        assert 'field("FIRST USABLE "' in source.read_text(), 'Missing first-usable report field'
        assert 'field("LAST USABLE "' in source.read_text(), 'Missing last-usable report field'
        print('Optional pooled label FIRST USABLE:', b'FIRST USABLE' in data)
        assert b'NABU UFS GPT V1 - READ ONLY' in data
        source_text = source.read_text()
        assert source_text.count('p.write(0x58, 1);') == 1
        assert 'p.write(0x34' not in source_text and 'p.write(0x90' not in source_text
        assert 'pinnedDma->complete' not in source_text and 'pinnedDma->release' not in source_text
        assert 'dc civac' in source_text and 'dc ivac' in source_text
        assert 'IODelay(' not in source_text
        assert 'static constexpr unsigned blockReadBytes = 4096' in source_text
        assert 'memory[ucdOffset + 24] = 1;' in source_text
        assert 'NabuNop::Request{0x28,0,0,blockBytes,uint32_t(lba)}' in source_text
        assert 'report.blockBytes != blockBytes' in source_text
        assert 'No fallback, automatic repair, retries' in source_text
        assert '#define NABU_REPORT_HOST_TEST' not in source_text
        assert 'readGuards(memory)' in source_text
        assert b'LIVE STEP\0' in data and b'LIVE VALUE\0' in data
        sha = hashlib.sha256(data).hexdigest()
        report = {
            'purpose': 'SM8150/nabu one-boot read-only primary and backup GPT scan with CRC, partition range/overlap/GUID checks and fixed full report',
            'kernel_sha256': sha,
            'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
            'upstream_commit': 'eafa7e11ee63ac6a87b4a16019f51bcc1a980bb2',
            'required_boot_argument': 'nabu-ufs-register-probe=1',
            'required_page_argument': 'nabu-ufs-gpt=1 (one bounded GPT scan; no configurable LBA or count)',
            'expected_ufs_sid': '0x300 from SM8150 device tree; not discovered at runtime',
            'smmu_window': '0x15000000 + 0x100000 from stock nabu vendor device tree',
            'ufs_sid_reference': 'https://github.com/torvalds/linux/blob/v6.12/arch/arm64/boot/dts/qcom/sm8150.dtsi',
            'smmu_reference': 'https://github.com/torvalds/linux/blob/v6.12/drivers/iommu/arm/arm-smmu/arm-smmu.h',
            'runtime_qualified': False,
            'live_step_codes': {
                '0A': 'Before doorbell write', '0B': 'Doorbell store and DSB returned',
                '0C': 'Before first doorbell read', '0D': 'Doorbell read returned; LIVE VALUE is DB',
                '0E': 'Interrupt-status read returned; LIVE VALUE is accumulated IS',
                '0F': 'Before invalidate-only DMA acquire', '10': 'DMA cache acquire returned',
                '11': 'OCS byte loaded; LIVE VALUE is OCS', '12': 'Before finite CPU pacing',
                '13': 'CPU pacing returned', '15': 'Transfer poll iteration limit reached',
            },
            'scope_review': {
                'controller_mmio_stores': 'Idle queue takeover: IE=0, UTRL stop/base/start, completion W1C=1 and at most 71 single-command doorbell submissions; no HCE reset, UIC commands or task-list changes',
                'scsi_commands': 'Runtime READ CAPACITY10 then fixed4096-byte single-block READ10 on LUN0 metadata LBAs authorized by validated headers; no boot-configurable LBA/CDB, WRITE, START STOP or resets',
                'dma': 'Dedicated prepared physically-contiguous 16 KiB allocation, raw PA, CTR-sized cache maintenance; retained until reboot; reused only between verified successful commands; no complete/release',
                'queue_or_ttbr_address_dereferences': 'Only own DMA allocation is dereferenced; firmware queue addresses and page tables are never mapped',
                'smmu_mapping_changes': 'None implemented',
                'smmu_scan_guard': 'ID0.SMS and bounded NUMSMRG; EXIDS valid-bit mode checked',
                'context_read_guard': 'One SID 0x300 match, CB1, CBAR.TYPE=1, CBA2R.VA64=1, SCTLR.M=0; no SMMU faults; route rechecked before submission and after response',
                'block_device_publication': 'None implemented',
                'query_allowlist': 'READ DESC device IDN0/index0 or unit IDN2/index0..7 with max255, READ FLAG fDeviceInit IDN1, READ ATTR currentPowerMode IDN2; selector0 and STANDARD READ only',
                'read_scope': 'MBR, primary header/array and backup header/array only; <=256 entries, entry size128/256/512, array<=128KiB, <=67 block reads; CRCs, ranges, overlap, unique GUIDs and exact primary/backup-array match; no partition-content/filesystem reads',
                'capacity_scope': 'READ CAPACITY10 must match unit0 descriptor in the same boot; require 4096-byte blocks and nonzero count; 0xffffffff lastLBA stops for future RC16',
                'reuse_guard': 'NOP, unit0 descriptor, active power query, matching READ CAPACITY10, then bounded metadata reads; each verified before advancing; any failure stops immediately without retry, repair or later IO',
                'host_register_guard': 'Power/clock valid, UFSHCI 2.x/3.0, HCE/HCS ready, transfer/task queues idle, no error, auto-hibernate disabled; otherwise skipped',
            },
            'linked_probe_object_symbol_checks': 'passed',
            'final_link_arguments_exclude_duplicate_storage_base': True,
            'stop': '96 means display complete; terminal report success requires RESULT=0, IO=0 and FLAGS=0x3f; all numbers hex; no complete/release; power reboot after report. LIVE STEP is per-command; 98 means sequence returned.',
        }
        report['recovery_origin'] = json.loads(Path('recovery-origin.json').read_text())
        previous = list(Path('kernel-input').rglob('ufs-gpt-v1.json'))
        assert len(previous) <= 1
        (previous[0] if previous else Path('kernel-input/ufs-gpt-v1.json')).write_text(json.dumps(report, indent=2) + '\n')
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write('kernel_sha256=' + sha + '\n')
        print(json.dumps(report, indent=2))
        AUDIT
    - name: Check out pinned ADT generator
      uses: actions/checkout@v4
      with:
        repository: Lux12138/UniXNU
        ref: 48ea812633d59b796dee3dc0781b9e174075f457
        path: UniXNU-source
        persist-credentials: false
    - name: Check kernel and prepare staging directory
      shell: bash
      run: |
        python3 - <<'PY'
        import hashlib
        import os
        import json
        import shutil
        import struct
        from pathlib import Path

        candidates = list(Path('kernel-input').rglob('kernel.macho'))
        assert len(candidates) == 1, 'Expected exactly one kernel.macho'
        source = candidates[0]
        data = source.read_bytes()
        expected = os.environ['EXPECTED_KERNEL_SHA256']
        assert len(expected) == 64
        assert hashlib.sha256(data).hexdigest() == expected, 'Kernel differs from checked artifact'
        magic, cpu, subtype, filetype, count, command_bytes = struct.unpack_from('<6I', data)
        assert (magic, cpu, subtype, filetype) == (0xfeedfacf, 0x100000c, 0, 2)
        end = 32 + command_bytes
        assert end <= len(data)
        offset = 32
        segments = []
        entry = None
        for _ in range(count):
            assert offset + 8 <= end
            command, length = struct.unpack_from('<II', data, offset)
            assert length >= 8 and length % 8 == 0 and offset + length <= end
            if command == 0x19:
                assert length >= 72
                address, size, file_offset, file_size = struct.unpack_from('<4Q', data, offset + 24)
                sections = struct.unpack_from('<I', data, offset + 64)[0]
                assert sections <= (length - 72) // 80
                if size:
                    protection = struct.unpack_from('<I', data, offset + 60)[0]
                    assert size <= 0x10000000 and address + size < 1 << 64
                    assert file_size <= size and file_offset + file_size <= len(data)
                    segments.append((address, size, file_size, protection))
            elif command == 5:
                assert entry is None and length == 288
                assert struct.unpack_from('<II', data, offset + 8) == (6, 68)
                entry = struct.unpack_from('<Q', data, offset + 272)[0]
            offset += length
        assert offset == end and entry is not None and 0 < len(segments) <= 64
        ordered = sorted(segments)
        assert all(a[0] + a[1] <= b[0] for a, b in zip(ordered, ordered[1:])), 'Overlapping segments'
        base = min(s[0] for s in segments)
        limit = max(s[0] + s[1] for s in segments)
        assert base % 4096 == 0 and entry % 4 == 0
        assert limit - base <= 0x10000000 - 0x200000
        assert any(a <= entry < a + f and p & 4 for a, _, f, p in segments)
        target = Path('stage/EFI/UniXNU/Payloads')
        target.mkdir(parents=True)
        shutil.copyfile(source, target / 'kernel.macho')
        Path('payload-output').mkdir()
        mappings = list(Path('kernel-input').rglob('post64-checkpoints.json'))
        assert len(mappings) == 1, 'Expected the post64 checkpoint mapping'
        shutil.copyfile(mappings[0], 'payload-output/post64-checkpoints.json')
        probes = list(Path('kernel-input').rglob('ufs-gpt-v1.json'))
        assert len(probes) == 1
        assert json.loads(probes[0].read_text())['kernel_sha256'] == expected
        shutil.copyfile(probes[0], 'payload-output/ufs-gpt-v1.json')
        shutil.copyfile('recovery-origin.json', 'payload-output/recovery-origin.json')
        # Verify the new state variable is present in the linked symbol table.
        offset = 32
        found = False
        for _ in range(count):
            command, length = struct.unpack_from('<II', data, offset)
            if command == 2:
                symoff, nsyms, stroff, strsize = struct.unpack_from('<4I', data, offset + 8)
                strings = data[stroff:stroff+strsize]
                index = strings.find(b'_g_last_hit\0')
                if index >= 0:
                    found = any(i == index and t & 0x0e == 0x0e
                                for i, t, section, desc, value in struct.iter_unpack(
                                    '<IBBHQ', data[symoff:symoff+nsyms*16]))
            offset += length
        assert found, 'Post64 diagnostic state is missing from the kernel'
        report = {
            'purpose': 'One-boot read-only primary/backup GPT validation, bounded to metadata; terminal two-column report of all validated names/ranges; no disk writes or filesystem readiness claim',
            'runtime_qualified': False,
            'abi_qualified': False,
            'kernel_source_run': int(os.environ['SOURCE_RUN_ID']),
            'kernel_sha256': expected,
            'kernel_virtual_span_bytes': limit - base,
            'device_dram_bytes': 0x180000000,
            'requested_contiguous_window_bytes': 0x20000000,
            'window_address': 'Allocated from EfiConventionalMemory by DarwinBoot at runtime',
            'expected_cust_partition_bytes': 0x40000000,
            'observed_userdata_bytes': 0x1AB57BB000,
            'storage_layout_changes': 'None performed by this workflow',
        }
        Path('payload-output/payload-manifest.json').write_text(json.dumps(report, indent=2) + '\n')
        print(json.dumps(report, indent=2))
        PY
      env:
        EXPECTED_KERNEL_SHA256: ${{ steps.audit.outputs.kernel_sha256 }}
    - name: Generate 6 GiB diagnostic ADT
      shell: bash
      run: |
        python3 UniXNU-source/scripts/make-nabu-adt.py \
          --dram-size 0x180000000 \
          --owned-memory-size 0x20000000 \
          --cpu-regs '0,0x100,0x200,0x300,0x400,0x500,0x600,0x700' \
          --output stage/EFI/UniXNU/Payloads/kernel.macho.adt
    - name: Create manual boot menu
      shell: bash
      run: |
        cat > stage/EFI/UniXNU/unixnu.toml <<'TOML'
        version = 1
        [boot]
        timeout = -1
        fallback_timeout = 120
        default = "return"
        rotate = 0
        [kits]
        autoload = false
        [ui]
        title = "nabu UFS GPT v1"
        logo = true
        console = "auto"
        [[entry]]
        id = "return"
        title = "Return to firmware"
        type = "action"
        action = "exit"
        [[entry]]
        id = "gpt"
        title = "Scan primary and backup GPT - read only"
        type = "xnu"
        path = "Payloads/kernel.macho"
        args = "serial=3 -enable_kprintf_spam nabu-ufs-register-probe=1 nabu-ufs-gpt=1"
        [[entry]]
        id = "restart"
        title = "Restart"
        type = "action"
        action = "reset"
        TOML
    - name: Install FAT image utilities
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
        sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y --no-install-recommends dosfstools mtools
    - name: Build and verify FAT payload image
      shell: bash
      run: |
        set -euo pipefail
        IMAGE="$GITHUB_WORKSPACE/payload-output/nabu-cust-ufs-gpt-v1.img"
        truncate -s 64M "$IMAGE"
        mkfs.vfat -F 16 -n NABUXNU "$IMAGE"
        mcopy -i "$IMAGE" -s stage/EFI ::/
        fsck.fat -n "$IMAGE"
        mkdir payload-readback
        mcopy -i "$IMAGE" -s ::/EFI payload-readback/
        diff -r stage/EFI payload-readback/EFI
        mdir -i "$IMAGE" -/ ::/EFI/UniXNU
        python3 - <<'PY'
        import hashlib
        import json
        import struct
        from pathlib import Path

        image = Path('payload-output/nabu-cust-ufs-gpt-v1.img')
        assert image.stat().st_size == 64 * 1024 * 1024
        tree = Path('stage/EFI/UniXNU/Payloads/kernel.macho.adt').read_bytes()
        nodes = {}
        def parse(offset=0, parent=''):
            properties, children = struct.unpack_from('<II', tree, offset)
            offset += 8
            values = {}
            for _ in range(properties):
                key, length = struct.unpack_from('<32sI', tree, offset)
                offset += 36
                key = key.split(b'\0', 1)[0].decode()
                assert offset + length <= len(tree)
                values[key] = tree[offset:offset+length]
                offset += (length + 3) & ~3
            name = values['name'].rstrip(b'\0').decode()
            path = parent + '/' + name
            nodes[path] = values
            for _ in range(children):
                offset = parse(offset, path)
            return offset
        assert parse() == len(tree)
        chosen = nodes['/device-tree/chosen']
        assert struct.unpack('<Q', chosen['dram-size'])[0] == 0x180000000
        assert struct.unpack('<Q', chosen['darwinboot-memory-size'])[0] == 0x20000000
        memory = nodes['/device-tree/chosen/memory-map']
        assert not any(k in memory for k in ('RAMDisk', 'PackedRAMDisk', 'TrustCache'))
        report_path = Path('payload-output/payload-manifest.json')
        report = json.loads(report_path.read_text())
        report['files'] = {
            str(p): {'bytes': p.stat().st_size, 'sha256': hashlib.sha256(p.read_bytes()).hexdigest()}
            for p in [image, *sorted(Path('stage/EFI').rglob('*'))] if p.is_file()
        }
        report_path.write_text(json.dumps(report, indent=2) + '\n')
        print('FAT filesystem, file readback and ADT checks passed.')
        PY
    - name: Upload payload for review
      uses: actions/upload-artifact@v4
      with:
        name: nabu-ufs-gpt-v1-payload
        if-no-files-found: error
        compression-level: 6
        path: payload-output/
